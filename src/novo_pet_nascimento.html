<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fundo: '#FFFBF6',
                        superficie: '#F8F0E6',
                        botao2: '#EEEE88',
                        borda: '#E9DDCF',
                        laranja: '#F29A4B',
                        texto1: '#2B1A0E',
                        texto2: '#75634F',
                        texto3: '#8F4B17',
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                },
            },
        }
    </script>

    <style>
        input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: 0;
            display: none;
        }
    </style>

</head>
<body>

    <!-- MOBILE -->
    <section class="block md:hidden min-h-screen w-full bg-fundo">
        <div class="min-h-screen w-full bg-fundo flex flex-col">

            <header class="h-16 shrink-0 px-6 border-b border-borda flex items-center gap-4">
                <button type="button" aria-label="Voltar" onclick="window.location.href = 'novo_pet_raca.html'"
                    class="size-5 shrink-0 flex items-center justify-center">
                    <img src="svg/voltar.svg" alt="Figura de voltar laranja" class="size-4 object-contain">
                </button>
                <h1 class="text-texto2 text-lg font-semibold font-['Inter']">Novo pet</h1>
            </header>

            <div class="px-6 pt-5 pb-1 flex gap-1.5">
                <div class="flex-1 h-[5px] bg-texto2 rounded-full"></div>
                <div class="flex-1 h-[5px] bg-texto2 rounded-full"></div>
                <div class="flex-1 h-[5px] bg-texto2 rounded-full"></div>
                <div class="flex-1 h-[5px] bg-borda rounded-full"></div>
                <div class="flex-1 h-[5px] bg-borda rounded-full"></div>
            </div>

            <form id="form-nascimento-mobile" class="flex-1 flex flex-col px-6 pt-5 pb-28 gap-6">

                <h2 id="titulo-nascimento-mobile"
                    class="text-texto1 text-2xl font-semibold font-['Inter'] leading-8">
                    Qual a data de nascimento do seu pet?
                </h2>

                <div class="flex flex-col gap-2">
                    <label for="data-nascimento-mobile"
                        class="text-texto2 text-base font-normal font-['Inter']">
                        Aproximada
                    </label>

                    <div class="relative w-full h-12 px-3.5 bg-superficie border border-borda rounded-xl flex items-center gap-2.5 focus-within:ring-2 focus-within:ring-laranja">
                        <input id="data-nascimento-mobile" name="data-nascimento" type="date"
                            class="min-w-0 flex-1 w-full h-full bg-transparent text-texto1 outline-none">

                        <button type="button" id="abrir-calendario-nascimento-mobile"
                            aria-label="Abrir calendário"
                            class="size-5 shrink-0 flex items-center justify-center cursor-pointer">
                            <img src="svg/calendario.svg" alt="Figura de um calendário laranja"
                                class="size-4 object-contain pointer-events-none">
                        </button>
                    </div>
                </div>

                <label for="nao-sei-data-mobile"
                    class="flex items-center gap-3 cursor-pointer text-texto2 text-base font-normal font-['Inter']">
                    <input id="nao-sei-data-mobile" name="nao-sei-data" type="checkbox"
                        class="size-5 shrink-0 accent-laranja rounded">
                    <span>Não sei a data</span>
                </label>

                <p id="erro-nascimento-mobile" class="hidden text-sm text-red-700" role="alert">
                    Informe a data de nascimento ou selecione "Não sei a data".
                </p>

            </form>

            <footer class="fixed bottom-0 left-0 right-0 z-20 bg-fundo border-t border-borda px-6 pt-3 pb-6">
                <button type="submit" form="form-nascimento-mobile"
                    class="w-full h-12 px-5 bg-laranja rounded-xl border border-laranja flex justify-center items-center hover:bg-[#E8863A] transition">
                    <span class="text-texto1 text-base font-semibold font-['Inter']">Avançar</span>
                </button>
            </footer>

        </div>
    </section>

    <script>
        const formNascimentoMobile = document.getElementById('form-nascimento-mobile');
        const dataNascimentoMobile = document.getElementById('data-nascimento-mobile');
        const naoSeiDataMobile = document.getElementById('nao-sei-data-mobile');
        const abrirCalendarioNascimento = document.getElementById('abrir-calendario-nascimento-mobile');
        const erroNascimentoMobile = document.getElementById('erro-nascimento-mobile');
        const tituloNascimentoMobile = document.getElementById('titulo-nascimento-mobile');

        const nomePetNascimento = sessionStorage.getItem('nomePet');

        if (nomePetNascimento) {
            tituloNascimentoMobile.textContent = `Qual a data de nascimento de ${nomePetNascimento}?`;
        }

        abrirCalendarioNascimento.addEventListener('click', () => {
            if (dataNascimentoMobile.disabled) return;

            if (typeof dataNascimentoMobile.showPicker === 'function') {
                dataNascimentoMobile.showPicker();
            } else {
                dataNascimentoMobile.focus();
                dataNascimentoMobile.click();
            }
        });

        naoSeiDataMobile.addEventListener('change', () => {
            const naoSabe = naoSeiDataMobile.checked;

            dataNascimentoMobile.disabled = naoSabe;
            dataNascimentoMobile.required = !naoSabe;

            if (naoSabe) {
                dataNascimentoMobile.value = '';
                erroNascimentoMobile.classList.add('hidden');
            }
        });

        dataNascimentoMobile.addEventListener('change', () => {
            erroNascimentoMobile.classList.add('hidden');

            if (dataNascimentoMobile.value) {
                naoSeiDataMobile.checked = false;
                dataNascimentoMobile.disabled = false;
            }
        });

        formNascimentoMobile.addEventListener('submit', (event) => {
            event.preventDefault();

            const dataNascimento = dataNascimentoMobile.value;
            const naoSabe = naoSeiDataMobile.checked;

            if (!dataNascimento && !naoSabe) {
                erroNascimentoMobile.classList.remove('hidden');
                return;
            }

            erroNascimentoMobile.classList.add('hidden');

            sessionStorage.setItem('dataNascimentoPet', naoSabe ? 'Não sei' : dataNascimento);

            window.location.href = 'novo_pet_informacoes.html';
        });
    </script>


</body>
</html>
