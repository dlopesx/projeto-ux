<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fundo: '#FFFBF6',
                        superficie: '#F8F0E6',
                        botao2: '#EEEE88',
                        borda: '#E9DDCF',
                        laranja: '#F29A4B',
                        texto1: '#2B1A0E',
                        texto2: '#75634F',
                        texto3: '#8F4B17',
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                },
            },
        }
    </script>

</head>
<body>

    <!-- MOBILE -->

    <section class="block md:hidden min-h-screen w-full bg-fundo">
        <div class="min-h-screen w-full bg-fundo flex flex-col">

            <header class="h-16 shrink-0 px-5 border-b border-borda flex items-center gap-4">
                <button type="button" aria-label="Voltar" onclick="window.location.href = 'novo_pet.html'"
                    class="size-6 shrink-0 flex items-center justify-center">
                    <img src="svg/voltar.svg" alt="" class="size-4 object-contain">
                </button>
                <h1 class="text-texto2 text-lg font-semibold font-['Inter']">Novo pet</h1>
            </header>

            <div class="px-6 pt-5 pb-1 flex gap-1.5">
                <div class="flex-1 h-[5px] bg-texto2 rounded-full"></div>
                <div class="flex-1 h-[5px] bg-texto2 rounded-full"></div>
                <div class="flex-1 h-[5px] bg-borda rounded-full"></div>
                <div class="flex-1 h-[5px] bg-borda rounded-full"></div>
                <div class="flex-1 h-[5px] bg-borda rounded-full"></div>
            </div>

            <form id="form-raca-mobile" class="flex-1 flex flex-col px-6 pt-5 pb-28 gap-6">

                <h2 id="titulo-raca-mobile" class="text-texto1 text-2xl font-semibold font-['Inter'] leading-8">
                    Qual a raça do seu pet?
                </h2>

                <div class="w-full">
                    <label for="raca-pet-mobile" class="sr-only">Raça do pet</label>

                    <div id="campo-raca-mobile"
                        class="w-full h-12 px-3.5 bg-superficie border border-borda rounded-xl flex items-center gap-2.5 focus-within:ring-2 focus-within:ring-laranja">

                        <input id="raca-pet-mobile" name="raca" type="text"
                            placeholder="Digite ou pesquise a raça"
                            class="min-w-0 flex-1 w-full h-full bg-transparent text-texto1 outline-none border-0 focus:ring-0 placeholder:text-texto2">

                        <button type="button" id="pesquisar-raca-mobile"
                            aria-label="Pesquisar raça"
                            class="size-5 shrink-0 flex items-center justify-center">
                            <img src="svg/pesquisar.svg" alt="" class="size-4 object-contain">
                        </button>
                    </div>
                </div>

                <label for="nao-sei-raca-mobile"
                    class="flex items-center gap-3 cursor-pointer text-texto2 text-base font-normal font-['Inter']">

                    <input id="nao-sei-raca-mobile" name="nao-sei-raca" type="checkbox"
                        class="size-5 shrink-0 accent-laranja rounded">

                    <span>Não sei a raça</span>
                </label>

                <p id="erro-raca-mobile" class="hidden text-sm text-red-700" role="alert">
                    Informe a raça ou selecione "Não sei a raça".
                </p>

            </form>

            <footer class="fixed bottom-0 left-0 right-0 z-20 bg-fundo border-t border-borda px-6 pt-3 pb-6">
                <button type="submit" onclick="" form="form-raca-mobile"
                    class="w-full h-12 px-5 bg-laranja rounded-xl border border-laranja flex justify-center items-center hover:bg-[#E8863A] transition">
                    <span class="text-texto1 text-base font-semibold font-['Inter']">Avançar</span>
                </button>
            </footer>

        </div>
    </section>



    <script>

        const formRacaMobile = document.getElementById('form-raca-mobile');
        const campoRacaMobile = document.getElementById('raca-pet-mobile');
        const naoSeiRacaMobile = document.getElementById('nao-sei-raca-mobile');
        const botaoPesquisarRaca = document.getElementById('pesquisar-raca-mobile');
        const erroRacaMobile = document.getElementById('erro-raca-mobile');
        const tituloRacaMobile = document.getElementById('titulo-raca-mobile');

        const nomePetSalvo = sessionStorage.getItem('nomePet');

        if (nomePetSalvo) {
            tituloRacaMobile.textContent = `Qual a raça de ${nomePetSalvo}?`;
        }

        naoSeiRacaMobile.addEventListener('change', () => {
            const naoSabe = naoSeiRacaMobile.checked;

            campoRacaMobile.disabled = naoSabe;
            campoRacaMobile.required = !naoSabe;

            if (naoSabe) {
                campoRacaMobile.value = '';
                campoRacaMobile.placeholder = 'Raça não informada';
                erroRacaMobile.classList.add('hidden');
            } else {
                campoRacaMobile.placeholder = 'Digite ou pesquise a raça';
            }
        });

        botaoPesquisarRaca.addEventListener('click', () => {
            if (!naoSeiRacaMobile.checked) {
                campoRacaMobile.focus();
            }
        });

        campoRacaMobile.addEventListener('input', () => {
            erroRacaMobile.classList.add('hidden');

            if (campoRacaMobile.value.trim()) {
                naoSeiRacaMobile.checked = false;
                campoRacaMobile.disabled = false;
                campoRacaMobile.required = true;
                campoRacaMobile.placeholder = 'Digite ou pesquise a raça';
            }
        });

        formRacaMobile.addEventListener('submit', (event) => {
            event.preventDefault();

            const raca = campoRacaMobile.value.trim();
            const naoSabe = naoSeiRacaMobile.checked;

            if (!raca && !naoSabe) {
                erroRacaMobile.classList.remove('hidden');
                return;
            }

            erroRacaMobile.classList.add('hidden');

            sessionStorage.setItem('racaPet', naoSabe ? 'Não sei' : raca);

            window.location.href = 'novo_pet_nascimento.html';
        });

    </script>


</body>
</html>
