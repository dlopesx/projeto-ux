<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Vacina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style type="text/tailwindcss"> 
        @layer components {
            .campo {
            @apply w-full h-12 px-4 bg-[#F8F0E6] border border-[#E9DDCF] rounded-2xl outline-none transition
            focus:ring-2 focus:ring-[#F29A4B] disabled:opacity-50 disabled:cursor-not-allowed;
            }
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fundo: '#FFFBF6',
                        superficie: '#F8F0E6',
                        botao2: '#EEEE88',
                        borda: '#E9DDCF',
                        laranja: '#F29A4B',
                        texto1: '#2B1A0E',
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                },
            },
        }
    </script>
</head>
<body>

    <!--DESKTOP-->
    <section class="hidden md:block">
        <div class="flex">

            <!-- SIDEBAR-->

            <!-- SIDEBAR-->

            <aside id="default-sidebar" class=" bg-[#F8F0E6] p-3 flex flex-col shrink-0 w-60 min-h-screen " aria-label="Sidebar">
                <div class=" flex flex-col flex-1 px-3 py-4 justify-between bg-neutral-primary-soft">
                    <ul class=" flex-1 space-y-2 font-medium">
                        <li class="flex">
                            <a href="#" class="flex flex-1 items-center px-2 py-3  rounded-2xl  group">
                            <span class="px-1 pb-6 text-xl font-bold">Site nome</span>
                            </a>
                            <button> <img class="pb-6" src = "svg/fechar.svg" alt="X cinza para fechar menu lateral"/></button>
                        </li>
                        <li dir="ltr">
                            <a href="#" class="flex items-center px-2 py-3  rounded-xl hover:bg-[#E9DDCF]  group">
                            <img src = "svg/inicio.svg" alt="Figura de uma casa na cor laranja"/>
                            <span class="flex-1 ms-3 whitespace-nowrap">Início</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                            <img src = "svg/paw-print.svg" a    lt="Pata de animal na cor laranja"/>
                            <span class="flex-1 ms-3 whitespace-nowrap">Meus pets</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                            <img src = "svg/calendario.svg" alt="Calendario na cor laranja"/>

                            <span class="flex-1 ms-3 whitespace-nowrap">Agendamentos</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                            <img src = "svg/notificacao.svg" alt="Sino de alerta na cor laranja"/>

                            <span class="flex-1 ms-3 whitespace-nowrap">Alertas</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                            <img src = "svg/tutores.svg" alt="Figura de usuários na cor laranja"/>
                            <span class="flex-1 ms-3 whitespace-nowrap">Outros tutores</span>
                            </a>
                        </li>
                    </ul>

                    <!-- RODAPÉ DA SIDEBAR-->
                    <ul class=" mt-auto space-y-2 py-5 border-t border-[#E9DDCF] ">
                        <li>
                            <a href="#" class="flex items-center gap-2 px-2 py-3 rounded-2xl hover:bg-[#E9DDCF]"> <img src = "svg/info.svg" alt="Símbolo de informação em laranja"/>Sobre</a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center gap-2 px-2 py-3 rounded-2xl hover:bg-[#E9DDCF]"><img src = "svg/help-circle.svg" alt="Símbolo de ajuda em laranja"/>Ajuda</a>
                            
                        </li>
                    </ul>
                    
                </div>
            </aside>

            <!-- HEADER E MAIN -->

            <div class=" bg-[#FFFBF6] flex flex-col self-stretch flex-1"> 

                <header class="flex flex-row justify-between p-5 border ">
                    <a href="index.html" class=" text-[] flex items-center gap-2 text-lg font-semibold text-[#473C31] hover:text-laranja transition rounded-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-laranja">
                        <span> <img alt="Figura de seta laranja" src="svg/voltar.svg"></span>
                        Voltar
                    </a>
                    <button> <img src = "svg/notificacao.svg" alt="Símbolo de informação em laranja"/> </button>
                </header>

                
                <main class="flex w-full py-8 px-16 flex-col items-start self-stretch">
                    
                    <div class="flex flex-col items-center self-stretch gap-[2.25rem]">
                        <div class="flex justify-between self-stretch items-center">
                            <h1 class= " flex items-start self-stretch text-4xl font-semibold"> Adicionar vacina </h1>
                        </div>
                        
                        <!-- SEÇÃO: NOVO ALERTA-->

                        <div class="flex flex-col self-stretch gap-3"> 
            
                            <form method="post" id="form-vacina" class="flex flex-col gap-8 w-full max-w-[500px] border border-[#E9DDCF] rounded-2xl p-6">
                                <div class="grid grid-cols-1 gap-x-6 gap-y-5"> 
                                    <div class="flex flex-col gap-3">
                                        <label> Selecione o nome da vacina</label>
                                        <input class="campo outline-none focus:visible focus:ring-2 w-full h-14 bg-[#F8F0E6] rounded-2xl">
                                    </div>
                                    <div class="flex flex-col gap-3 ">
                                        <label> Data da última dose</label>
                                        <input class="campo outline-none w-full h-14 bg-[#F8F0E6] rounded-2xl">
                                    </div>
                                </div>
                                <div class="flex gap-4  ">
                                    <input type="checkbox" class="flex bg-[#FEEA8F] rounded-2xl font-semibold hover:bg-[#FEEA1F] hover:shadow-md transition transition accent-[#F29A4B]" > 
                                    <label> Ainda não tomou a primeira dose </label>
                                </div>
                                
                                <button id="bt-adicionar" type="submit" class=" aria-label='Adicionar vacina - enviar' flex bg-[#F29A4B] w-40 px-4 py-3 gap-4 rounded-2xl font-semibold hover:bg-[#E8863A] hover:shadow-md transition transition" > <img src = "svg/adicionar.svg" alt="Botão de 'Mais'"/>
                                Adicionar </button>
                                <div id="vacina-adicionada" class="hidden flex w-85 items-center p-4 gap-3 fixed top-[7rem] right-[5rem] text-body bg-[#E8863A] rounded-xl shadow-xs border border-default" role="alert">
                                    <div class="inline-flex items-center justify-center shrink-0 w-7 h-7 text-fg-success bg-success-soft rounded">
                                        <svg class="w-7 h-7 border border-[#111111] rounded-md" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 11.917 9.724 16.5 19 7.5"/></svg>
                                        <span class="sr-only">Check icon</span>
                                    </div>
                                    <div class="ms-3 text-xl font-normal ">Vacina adicionada com sucesso.</div>
                                    <button type="button" id="bt-fechar" class="ms-auto flex items-center justify-center text-body hover:text-heading bg-transparent box-border border border-transparent hover:bg-neutral-secondary-medium focus:ring-4 focus:ring-neutral-tertiary font-medium leading-5 rounded text-sm h-8 w-8 focus:outline-none" data-dismiss-target="#toast-success" aria-label="Close">
                                        <span class="sr-only">Close</span>
                                        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/></svg>
                                    </button>
                                </div>
                            </form>
                                
                        </div>
                    
            
                    </div>
                    
            
                </main>

            </div> 
            


        </div>
    </section>

    <!--MOBILE-->

    <section class="block md:hidden min-h-screen w-full bg-fundo flex flex-col">
        <div class="flex-1 min-h-screen w-full bg-fundo flex flex-col">

            <header class="h-16 shrink-0 px-5 border-b border-borda flex items-center gap-4">
                <button type="button" aria-label="Voltar" onclick="window.location.href='painel_vacinas.html'"
                    class="size-6 shrink-0 flex items-center justify-center">
                    <img src="svg/voltar.svg" alt="" class="size-4 object-contain">
                </button>

                <h1 class="text-texto1 text-lg font-semibold font-['Inter']">
                    Adicionar vacina — Tina
                </h1>
            </header>

            <form id="form-vacina-mobile"
                class="flex-1 w-full rounded-b-3xl bg-fundo px-5 py-6 flex flex-col gap-6">

                <div class="text-texto1 text-2xl font-semibold font-['Inter'] leading-8">
                    Selecione o nome da vacina
                </div>

                <div class="w-full">
                    <label for="nome-vacina-mobile" class="sr-only">
                        Nome da vacina
                    </label>

                    <div class="h-12 w-full px-3.5 bg-superficie rounded-xl border border-borda flex items-center gap-2.5">
                        <input
                            id="nome-vacina-mobile"
                            name="nome-vacina"
                            type="text"
                            placeholder="Nome da vacina"
                            required
                            class="min-w-0 flex-1 w-full bg-transparent text-texto1 text-base outline-none placeholder:text-Texto-2"
                        >

                        <button type="button" aria-label="Pesquisar vacina"
                            class="size-5 shrink-0 flex items-center justify-center">
                            <img src="svg/pesquisar.svg" alt="" class="size-4 object-contain">
                        </button>
                    </div>
                </div>

                <div class="w-full flex flex-col gap-2">
                    <label for="data-vacina-mobile"
                        class="text-texto1 text-sm font-medium font-['Inter']">
                        Data da última dose
                    </label>

                    <div class="relative h-12 w-full px-3.5 bg-superficie rounded-xl border border-borda flex items-center">
                        <input
                            id="data-vacina-mobile"
                            name="data-ultima-dose"
                            type="date"
                            required
                            class="absolute inset-0 w-full h-full opacity-0 pointer-events-none"
                        >

                        <span id="data-vacina-texto"
                            class="flex-1 text-texto1 text-base font-normal pointer-events-none">
                        </span>

                        <button type="button" id="abrir-calendario-mobile"
                            aria-label="Abrir calendário"
                            class="relative z-10 size-6 shrink-0 flex items-center justify-center cursor-pointer">
                            <img src="svg/calendario.svg" alt=""
                                class="size-4 object-contain pointer-events-none">
                        </button>
                    </div>
                </div>

                <label for="nao-tomou-mobile"
                    class="min-h-12 w-full px-5 bg-botao2 rounded-xl border border-borda flex items-center justify-center gap-2 cursor-pointer">

                    <input
                        id="nao-tomou-mobile"
                        name="nao-tomou-primeira"
                        type="checkbox"
                        class="sr-only"
                    >

                    <span id="texto-primeira-dose"
                        class="text-texto1 text-base font-semibold font-['Inter'] text-center">
                        Ainda não tomou a primeira
                    </span>
                </label>

                <button type="submit"
                    class="mt-auto w-full h-12 shrink-0 px-5 bg-laranja rounded-xl border border-botao1 flex justify-center items-center">

                    <span class="text-texto1 text-base font-semibold font-['Inter']">
                        Adicionar
                    </span>
                </button>

                <div id="vacina-adicionada-mobile"
                    role="status"
                    class="hidden w-full items-center justify-between gap-3 rounded-xl bg-superficie border border-borda p-3">

                    <span class="text-texto1 text-sm">
                        Vacina adicionada!
                    </span>

                    <button type="button" id="bt-fechar-mobile"
                        aria-label="Fechar mensagem"
                        class="text-texto1 font-semibold px-2">
                        ✕
                    </button>
                </div>

            </form>
        </div>
    </section>

    

    <script>
        const adicionar = document.getElementById('bt-adicionar');
        const fechar = document.getElementById('bt-fechar');
        const painel = document.getElementById('vacina-adicionada');
        const form = document.getElementById('form-vacina');
        let timer;


        function mostrar() {
            painel.classList.remove('hidden');
            painel.classList.add('flex');
            clearTimeout(timer);
            timer = setTimeout(esconder, 5000);
        }

        function esconder() {
            clearTimeout(timer);
            painel.classList.add('hidden');
            painel.classList.remove('flex');
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();   // impede o recarregamento da página
            // aqui, no futuro, você guarda os dados da vacina
            mostrar();
        });

        fechar.addEventListener('click', esconder);

        //mobile   
        const dataVacina = document.getElementById('data-vacina-mobile');
        const abrirCalendario = document.getElementById('abrir-calendario-mobile');
        const textoData = document.getElementById('data-vacina-texto');
        const naoTomou = document.getElementById('nao-tomou-mobile');
        const textoPrimeiraDose = document.getElementById('texto-primeira-dose');

        const formMobile = document.getElementById('form-vacina-mobile');
        const painelMobile = document.getElementById('vacina-adicionada-mobile');
        const fecharMobile = document.getElementById('bt-fechar-mobile');

        let timerMobile;

        abrirCalendario.addEventListener('click', () => {
            if (dataVacina.disabled) return;

            dataVacina.classList.remove('pointer-events-none');

            if (typeof dataVacina.showPicker === 'function') {
                dataVacina.showPicker();
            } else {
                dataVacina.click();
            }
        });

        dataVacina.addEventListener('change', () => {
            if (!dataVacina.value) {
                textoData.textContent = '';
                return;
            }

            const [ano, mes, dia] = dataVacina.value.split('-');
            textoData.textContent = `${dia}/${mes}/${ano}`;
        });

        naoTomou.addEventListener('change', () => {
            const marcada = naoTomou.checked;

            dataVacina.disabled = marcada;
            dataVacina.required = !marcada;

            if (marcada) {
                dataVacina.value = '';
                textoData.textContent = '';
                dataVacina.classList.add('pointer-events-none');
                textoPrimeiraDose.textContent = 'Primeira dose ainda não tomada';
            } else {
                dataVacina.classList.remove('pointer-events-none');
                textoPrimeiraDose.textContent = 'Ainda não tomou a primeira';
            }
        });

        formMobile.addEventListener('submit', (event) => {
            event.preventDefault();

            painelMobile.classList.remove('hidden');
            painelMobile.classList.add('flex');

            clearTimeout(timerMobile);

            timerMobile = setTimeout(() => {
                painelMobile.classList.add('hidden');
                painelMobile.classList.remove('flex');
            }, 5000);
        });

        fecharMobile.addEventListener('click', () => {
            clearTimeout(timerMobile);
            painelMobile.classList.add('hidden');
            painelMobile.classList.remove('flex');
        });

    </script>

</body>
</html>
