<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss"> 
        @layer components {
            .campo {
                @apply rounded-2xl outline-none transition
                focus:ring-2 focus:ring-[#F29A4B] disabled:opacity-50 disabled:cursor-not-allowed;
        }
    }

    </style>
</head>
<body>

    <div class="flex">

       <!-- SIDEBAR-->

<aside id="default-sidebar" class=" bg-[#F8F0E6] p-3 flex flex-col shrink-0 w-60 min-h-screen " aria-label="Sidebar">
    <div class=" flex flex-col flex-1 px-3 py-4 justify-between bg-neutral-primary-soft">
        <ul class=" flex-1 space-y-2 font-medium">
            <li class="flex">
                <a href="#" class="flex flex-1 items-center px-2 py-3  rounded-2xl  group">
                <span class="px-1 pb-6 text-xl font-bold">Site nome</span>
                </a>
                <button> <img class="pb-6" src = "svg/fechar.svg" alt="X cinza para fechar menu lateral"/></button>
            </li>

            <!-- PERFIL DO USUÁRIO -->
            <li class="pb-3 mb-2 border-b border-[#E9DDCF]">
                <a href="#" aria-label="Perfil de Marina" class="group flex items-center gap-3 px-2 py-2 rounded-2xl hover:bg-[#E9DDCF]">
                    <span class="w-10 h-10 shrink-0 rounded-full bg-[#E9DDCF] group-hover:bg-[#F8F0E6] flex items-center justify-center font-semibold transition" aria-hidden="true">M</span>
                    <span class="flex-1 min-w-0 font-semibold truncate">Marina</span>
                </a>
            </li>

            <li class="relative">
                <a href="index.html" class="flex items-center px-2 py-3 rounded-xl hover:bg-[#E9DDCF]  group">
                <img src = "svg/inicio.svg" alt="Figura de uma casa na cor laranja"/>
                <span class="flex-1 ms-3 whitespace-nowrap">Início</span>
                </a>
            </li>
            <li>
                <a href="meus_pets.html" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                <img src = "svg/paw-print.svg" a    lt="Pata de animal na cor laranja"/>
                <span class="flex-1 ms-3 whitespace-nowrap">Meus pets</span>
                </a>
            </li>
            <li>
                <a href="meus_agendamentos.html" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                <img src = "svg/calendario.svg" alt="Calendario na cor laranja"/>

                <span class="flex-1 ms-3 whitespace-nowrap">Agendamentos</span>
                </a>
            </li>
            <li>
                <a href="meus_alertas.html" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                <img src = "svg/notificacao.svg" alt="Sino de alerta na cor laranja"/>

                <span class="flex-1 ms-3 whitespace-nowrap">Alertas</span>
                </a>
            </li>
            <li>
                <a href="tutores.html" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                <img src = "svg/tutores.svg" alt="Figura de usuários na cor laranja"/>
                <span class="flex-1 ms-3 whitespace-nowrap">Outros tutores</span>
                </a>
            </li>
        </ul>

        <!-- RODAPÉ DA SIDEBAR-->
        <ul class=" mt-auto space-y-2 py-5 border-t border-[#E9DDCF] ">
            <li>
                <a href="#" class="flex items-center gap-2 px-2 py-3 rounded-2xl hover:bg-[#E9DDCF]"> <img src = "svg/info.svg" alt="Símbolo de informação em laranja"/>Sobre</a>
            </li>
            <li>
                <a href="#" class="flex items-center gap-2 px-2 py-3 rounded-2xl hover:bg-[#E9DDCF]"><img src = "svg/help-circle.svg" alt="Símbolo de ajuda em laranja"/>Ajuda</a>
                
            </li>
        </ul>
           
    </div>
</aside>

        <!-- HEADER E MAIN -->

        <div class=" bg-[#FFFBF6] flex flex-col self-stretch flex-1"> 

            <header class="flex flex-row justify-between p-5 border ">
                <a href="index.html" class="flex gap-4">
                    <img alt="Figura de seta laranja" src="svg/voltar.svg">
                    <p> Voltar</p>
                </a>
                <button> <img src = "svg/notificacao.svg" alt="Símbolo de informação em laranja"/> </button>
            </header>

            
            <main class="flex w-full py-8 px-16 flex-col items-start self-stretch">
                
                <div class="flex flex-col items-center self-stretch gap-[2.25rem]">
                    <div class="flex justify-between self-stretch items-center">
                        <h1 class= " flex items-start self-stretch text-4xl font-semibold"> Novo alerta </h1>
                    </div>
                    
                    <!-- SEÇÃO: NOVO ALERTA-->

                    <div class="flex flex-col self-stretch gap-3"> 
        
                        <form id="form-alerta" class="flex flex-col gap-8 w-full max-w-[936px] border border-[#E9DDCF] rounded-2xl p-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5"> 
                                <div class="flex flex-col gap-3">
                                    <label> O que você precisa lembrar?</label>
                                    <input class="campo p-4 w-full h-14 bg-[#F8F0E6] rounded-2xl" placeholder="Ex: Limpar vasilhas">
                                </div>
                                <div class="flex flex-col gap-3">
                                    <label> Para qual pet?</label>
                                    <input class="campo w-full h-14 bg-[#F8F0E6] rounded-2xl">
                                </div>
                            </div>

                            <fieldset class="flex flex-col gap-4 border-0 p-0 m-0 min-w-0">
                                <legend class="font-semibold mb-4">Quando?</legend>
 
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">
                                    <div class="flex flex-col gap-2">
                                        <label for="data" class="sr-only">Data</label>
                                        <input  type="date" id="data" class="campo h-14 p-4 bg-[#F8F0E6] rounded-2xl">
                                    </div>
                                    <div class="flex flex-col gap-2">
                                        <label for="hora" class="sr-only" >Hora</label>
                                        <input type="time" id="hora" class="campo h-14 p-4 bg-[#F8F0E6] rounded-2xl">
                                    </div>
                                </div>
                            </fieldset>
                            
                            <fieldset class="flex flex-col"> 
                                <legend class="font-semibold mb-4"> Repetir?</legend>
                                <label class="flex items-center gap-3 cursor-pointer">
                                <input type="radio" name="repetir" value="nao" class="w-5 h-5 accent-[#F29A4B]">
                                Não repetir
                                </label>
                                
                                <div class="flex flex-wrap items-center gap-4">
                                <input id="repetir-semanal" type="radio" name="repetir" value="semanal" class="peer w-5 h-5 accent-laranja cursor-pointer">
                                <label for="repetir-semanal" class="cursor-pointer">A cada</label>
        
                                <div class="flex items-center gap-3 w-[204px] h-10 px-5 bg-[#F8F0E6] border border-[#E9DDCF] rounded-2xl focus-within:ring-2 focus-within:ring-[#F29A4B] transition">
                                    <label for="dia" class="sr-only">Dia da semana</label>
                                    <select id="dia" name="dia" class="accent-[#F29A4B] flex-1 min-w-0 h-full bg-transparent outline-none appearance-none cursor-pointer ">
                                        <option value="" disabled selected hidden>Dia da semana</option>
                                        <option value="dom">Domingo</option>
                                        <option value="seg">Segunda</option>
                                        <option value="ter">Terça</option>
                                        <option value="qua">Quarta</option>
                                        <option value="qui">Quinta</option>
                                        <option value="sex">Sexta</option>
                                        <option value="sab">Sábado</option>
                                    </select>
                                    <img src="seta-baixo.svg" alt="" class="w-5 h-5 shrink-0">
                                </div>
        
                                <div class="w-48 opacity-50 peer-checked:opacity-100 flex items-center gap-3 w-[204px] h-10 px-5 bg-[#F8F0E6] border border-[#E9DDCF] rounded-2xl focus-within:ring-2 focus-within:ring-[#F29A4B] transition">
                                    <label for="horario" class="sr-only">Horário</label>
                                    <input id="horario" name="horario" type="time" class="campo bg-[#F8F0E6]">
                                </div>

                            </fieldset>
                            <button id="bt-adicionar" type="submit" class="flex bg-[#F29A4B] w-60 px-4 py-3 gap-4 rounded-2xl font-semibold hover:bg-[#E8863A] hover:shadow-md transition transition" > <img src = "svg/adicionar.svg" alt="Botão de 'Mais'"/>
                            Adicionar </button>
                            <div id="alerta-adicionado" class="hidden flex w-85 items-center p-4 gap-3 fixed top-[7rem] right-[5rem] text-body bg-[#E8863A] rounded-xl shadow-xs border border-default" role="alert">
                                <div class="inline-flex items-center justify-center shrink-0 w-7 h-7 text-fg-success bg-success-soft rounded">
                                    <svg class="w-7 h-7 border border-[#111111] rounded-md" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 11.917 9.724 16.5 19 7.5"/></svg>
                                    <span class="sr-only">Check icon</span>
                                </div>
                                <div class="ms-3 text-xl font-normal ">Alerta adicionado com sucesso.</div>
                                <button type="button" id="bt-fechar" class="ms-auto flex items-center justify-center text-body hover:text-heading bg-transparent box-border border border-transparent hover:bg-neutral-secondary-medium focus:ring-4 focus:ring-neutral-tertiary font-medium leading-5 rounded text-sm h-8 w-8 focus:outline-none" data-dismiss-target="#toast-success" aria-label="Close">
                                    <span class="sr-only">Close</span>
                                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/></svg>
                                </button>
                            </div>
                        </form>
                            
                        </div>      
        
                    </div>
                
        
                </div>
                
        
            </main>

        </div>
        


    </div>
    <script>
        const adicionar = document.getElementById('bt-adicionar');
        const fechar = document.getElementById('bt-fechar');
        const painel = document.getElementById('alerta-adicionado');
        const form = document.getElementById('form-alerta');
        let timer;


        function mostrar() {
            painel.classList.remove('hidden');
            painel.classList.add('flex');
            clearTimeout(timer);
            timer = setTimeout(esconder, 5000);
        }

        function esconder() {
            clearTimeout(timer);
            painel.classList.add('hidden');
            painel.classList.remove('flex');
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();   // impede o recarregamento da página
            // aqui, no futuro, você guarda os dados da vacina
            mostrar();
        });

        fechar.addEventListener('click', esconder);
    </script>

</body>
</html>
