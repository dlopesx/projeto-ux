<!DOCTYPE html>
<html>
<head>
  	<meta charset="utf-8">
  	<meta name="viewport" content="initial-scale=1, width=device-width">
  	
  	<link rel="stylesheet"  href="./index.css" />
  	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        /* Remove o botão nativo de revelar senha do Edge */
        input::-ms-reveal,
        input::-ms-clear {
            display: none;
        }

    </style>

</head>
<body>
  	
  	<div class="relative bg-Fundo justify-start items-start overflow-hidden bg-[#FFFBF6] grid grid-cols-[3fr_2fr] w-full min-h-screen">
        <div class="min-w-0 min-h-screen p-28 relative bg-ondasFundo inline-flex flex-col justify-center items-start gap-9 overflow-hidden bg-[#fff6ec]">
            <div class="self-stretch justify-start text-Texto-1 text-7xl font-semibold font-['Inter'] leading-[77.76px]">Nome da aplicação</div>
            <div class="self-stretch justify-start text-Texto-2 text-2xl font-normal font-['Inter'] leading-9">Frase</div>
            <div class=" absolute bottom-0 left-0 w-full h-28">
                <img src="svg/curva.svg" alt="Figura em formato de curva branca" class="w-full h-full object-fill pointer-events-none"/>
            </div>
        </div>

        <!-- Cadastro -->
        <div class="min-w-0 min-h-screen w-full p-10 flex flex-col justify-center items-center overflow-hidden">

            <div class="w-full max-w-lg flex flex-col items-center gap-6">

                <!-- Abas de Login e Cadastro -->
                <div class="w-full flex items-center gap-4">

                    <!-- Login ativo -->
                    <a href="primeiro_acesso_login.html"
                    class="flex-1 h-12   text-Texto-2 rounded-xl 
                            flex justify-center items-center text-lg font-semibold">
                        Log In
                    </a>

                    <!-- Cadastro inativo -->
                    <a href="primeiro_acesso_cadastro.html"
                    class="flex-1 h-12 bg-[#F29A4B] text-white rounded-xl 
                            flex justify-center items-center text-lg font-semibold">
                        Cadastro
                    </a>

                </div>

                
                <!-- Nome -->
                <div class="w-full h-14 px-4 bg-[#FFFBF6] rounded-xl outline outline-1 outline-[#51443B] flex items-center gap-3">

                    <input type="text" name="nome" placeholder="Nome" class="flex-1 min-w-0 h-full bg-transparent outline-none border-none text-[#2B1A0E] text-base font-normal font-['Inter'] placeholder:text-[#51443B]"/>

                    <img src="svg/profile.svg" alt="Ícone de perfil" class="w-6 h-6 object-contain shrink-0"/>

                </div>

                <!-- E-mail -->
                <div class="w-full h-14 px-4 bg-[#FFFBF6] rounded-xl outline outline-1 outline-[#51443B] flex items-center gap-3">

                    <input type="email" name="email" placeholder="E-mail" class="flex-1 min-w-0 h-full bg-transparent outline-none border-none text-[#2B1A0E] text-base font-normal font-['Inter'] placeholder:text-[#51443B]"/>

                    <img src="svg/@.svg" alt="Ícone de e-mail" class="w-6 h-6 object-contain shrink-0"/>

                </div>

                <!-- Senha -->
                <div class="w-full h-14 px-4 bg-[#FFFBF6] rounded-xl outline outline-1 outline-[#51443B] flex items-center gap-3">

                    <input id="senha" type="password" name="senha" placeholder="Crie uma senha" class="flex-1 min-w-0 h-full bg-transparent outline-none border-none text-[#2B1A0E] text-base font-['Inter'] placeholder:text-[#51443B]"/>

                    <button type="button" onclick="alternarSenha('senha')" class="w-6 h-6 shrink-0 flex items-center justify-center" aria-label="Mostrar ou ocultar senha">
                        <img src="svg/olho.svg" alt="" class="w-6 h-6 object-contain" />
                    </button>

                </div>

                <!-- Senha repetida -->
                <div class="w-full h-14 px-4 bg-[#FFFBF6] rounded-xl outline outline-1 outline-[#51443B] flex items-center gap-3">

                    <input id="confirmarSenha" type="password" name="confirmarSenha" placeholder="Repita a sua senha novamente" class="flex-1 min-w-0 h-full bg-transparent outline-none border-none text-[#2B1A0E] text-base font-['Inter'] placeholder:text-[#51443B]"/>

                    <button type="button" onclick="alternarSenha('confirmarSenha')" class="w-6 h-6 shrink-0 flex items-center justify-center" aria-label="Mostrar ou ocultar senha">
                        <img src="svg/olho.svg" alt="" class="w-6 h-6 object-contain" />
                    </button>

                </div>

                <!-- Separador -->
                <div class="w-full flex items-center ">
                    <div class="flex-1 h-px bg-Borda"></div>
                    <span class="text-Texto-1 text-sm font-normal font-['Inter'] text-[#2B1A0E]">
                        ou
                    </span>
                    <div class="flex-1 h-px bg-Borda"></div>
                </div>

                <!-- Google -->
                <div class="w-64 h-12 px-4 bg-Fundo rounded-xl outline outline-1 outline-Borda flex justify-center items-center gap-3">
                    <span class="text-Texto-1 text-base font-semibold font-['Inter']">
                        Continuar com Google
                    </span>
                </div>


                <!-- Botão Finalizar -->
                <div class="w-64 h-12 bg-Botão-1 rounded-xl flex justify-center items-center outline outline-1 outline-Borda bg-[#F29A4B]">
                    <a href="primeiro_acesso_login.html" class="text-Texto-1 text-lg font-semibold font-['Inter']">
                        Finalizar
                    </span>
                </div>

                <!-- Acesso sem cadastro -->
                <div class="w-full text-center">
                    <span class="text-Texto-1 text-sm font-normal font-['Inter'] leading-5 text-[#2B1A0E]">
                        Continuar sem cadastro
                    </span>
                </div>
        </div>
    </div>
  	
  	
  	
  	
  	 <script>
        
        function alternarSenha(idCampo) {
            const campoSenha = document.getElementById(idCampo);

            if (campoSenha.type === "password") {
                campoSenha.type = "text";
            } else {
                campoSenha.type = "password";
            }
        }

    </script>
            
</body>
</html>
