<!DOCTYPE html>
<html>
<head>
  	<meta charset="utf-8">
  	<meta name="viewport" content="initial-scale=1, width=device-width">
  	
  	<link rel="stylesheet"  href="./index.css" />
  	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
    

    <script src="https://cdn.tailwindcss.com"></script>
  	
  	<style>
        .perfil-de-tina-desktop {
            width: 100%;
            position: relative;
            background-color: #fffbf6;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            min-height: 900px;
            text-align: left;
            font-size: 15px;
            color: #2b1a0e;
            font-family: Inter;
        }
        .navegao-lateral {
            width: 248px;
            background-color: #f8f0e6;
            border-right: 1px solid #e9ddcf;
            box-sizing: border-box;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 24px;
            position: relative;
            isolation: isolate;
            gap: 40px;
            min-height: 900px;
        }
        .pessoa {
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 0;
            flex-shrink: 0;
        }
        .avatar {
            height: 40px;
            width: 40px;
            border-radius: 100px;
            background-color: #e9ddcf;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .inicial {
            position: relative;
            font-weight: 600;
        }
        .nome {
            position: relative;
            font-size: 16px;
            font-weight: 600;
        }
        .cone-icon {
            height: 16px;
            width: 16px;
            position: relative;
        }
        .links {
            align-self: stretch;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            z-index: 1;
            flex-shrink: 0;
        }
        .item-de-navegao {
            align-self: stretch;
            height: 50px;
            border-radius: 12px;
            background-color: #f8f0e6;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding: 14px;
            box-sizing: border-box;
            gap: 12px;
        }
        .item-de-navegao2 {
            align-self: stretch;
            height: 50px;
            border-radius: 12px;
            background-color: #e9ddcf;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding: 14px;
            box-sizing: border-box;
            gap: 12px;
        }
        .paw-print-icon {
            height: 22px;
            width: 22px;
            position: relative;
        }
        .rtulo2 {
            position: relative;
        }
        .conta {
            width: calc(100% - 24px);
            margin: 0 !important;
            position: absolute;
            right: 0px;
            bottom: 32px;
            left: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            z-index: 2;
            flex-shrink: 0;
        }
        .divisor {
            width: 200px;
            height: 1px;
            position: relative;
            background-color: #e9ddcf;
        }
        .rea-principal {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            isolation: isolate;
            text-align: center;
            font-size: 20px;
        }
        .cabealho {
            align-self: stretch;
            height: 88px;
            border-bottom: 1px solid #e9ddcf;
            box-sizing: border-box;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0px 48px;
            z-index: 0;
        }
        .contedo {
            align-self: stretch;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 48px;
            z-index: 1;
        }
        .perfil-do-pet {
            align-self: stretch;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            gap: 32px;
        }
        .identificao {
            height: 539px;
            width: 300px;
            border-radius: 28px;
            background-color: #f29a4b;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 32px 0px;
            box-sizing: border-box;
            position: relative;
            isolation: isolate;
            gap: 24px;
            min-height: 470px;
        }
        .avatar-do-pet {
            width: 140px;
            height: 140px;
            border-radius: 100px;
            background-color: #fff6ec;
            border: 1px solid #e9ddcf;
            box-sizing: border-box;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 0;
        }
        .cone-icon5 {
            height: 70px;
            width: 70px;
            position: relative;
        }
        .nome-do-pet {
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1;
            flex-shrink: 0;
            text-align: left;
            font-size: 36px;
        }
        .cone-icon6 {
            height: 20px;
            width: 20px;
            position: relative;
        }
        .descrio {
            align-self: stretch;
            position: relative;
            line-height: 145%;
            z-index: 2;
            flex-shrink: 0;
        }
        .descrio2 {
            align-self: stretch;
            position: relative;
            line-height: 145%;
            z-index: 3;
            flex-shrink: 0;
        }
        .curva-icon {
            width: 300px;
            height: 24px;
            position: absolute;
            margin: 0 !important;
            bottom: 0px;
            left: 0px;
            z-index: 4;
            flex-shrink: 0;
        }
        .cuidados-do-pet {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 24px;
            text-align: left;
            font-size: 22px;
        }
        .descrio3 {
            align-self: stretch;
            position: relative;
            line-height: 145%;
            font-weight: 600;
        }
        .carto {
            align-self: stretch;
            border-radius: 20px;
            background-color: #f8f0e6;
            border: 1px solid #e9ddcf;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 28px;
            gap: 20px;
            font-size: 16px;
        }
        .descrio4 {
            align-self: stretch;
            position: relative;
            line-height: 145%;
        }
        .opes-de-cuidados {
            align-self: stretch;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 20px;
            font-size: 16px;
        }
        .cone-icon7 {
            width: 26px;
            height: 26px;
            position: relative;
        }
        .group-icon {
            width: 18px;
            height: 19px;
            position: relative;
        }
        .healthcare-icon {
            width: 24px;
            height: 24px;
            position: relative;
        }
        .vector-parent {
            width: 82px;
            height: 22px;
            position: absolute;
            margin: 0 !important;
            top: 29px;
            left: 29px;
            cursor: pointer;
            z-index: 2;
            text-align: left;
            font-size: 18px;
            color: #473c31;
        }
        .vector-icon {
            position: absolute;
            top: 4px;
            left: 0px;
            width: 19px;
            height: 18px;
        }
        .ttulo-da-tela {
            position: absolute;
            top: 0px;
            left: 30px;
            font-weight: 600;
        }
        .birthday-icon {
            width: 66px;
            height: 18px;
            position: absolute;
            margin: 0 !important;
            top: 459px;
            left: 125px;
            object-fit: cover;
            z-index: 3;
        }
    </style>
  	
</head>

                    </li>
                </ul>

            </div>
