<!DOCTYPE html>
<html>
<head>
  	<meta charset="utf-8">

  	<style>
        .perfil-de-tina-desktop {
            width: 100%;
            position: relative;
            background-color: #fffbf6;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            min-height: 900px;
            text-align: left;
            font-size: 15px;
            color: #2b1a0e;
            font-family: Inter;
        }
        .navegao-lateral {
            width: 248px;
            background-color: #f8f0e6;
            border-right: 1px solid #e9ddcf;
            box-sizing: border-box;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 24px;
            position: relative;
            isolation: isolate;
            gap: 40px;
            min-height: 900px;
        }
        .pessoa {
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 0;
            flex-shrink: 0;
        }
        .avatar {
            height: 40px;
            width: 40px;
            border-radius: 100px;
            background-color: #e9ddcf;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .inicial {
            position: relative;
            font-weight: 600;
        }
        .nome {
            position: relative;
            font-size: 16px;
            font-weight: 600;
        }
        .cone-icon {
            height: 16px;
            width: 16px;
            position: relative;
        }
        .links {
            align-self: stretch;
            overflow: hidden;
            display: flex;

            gap: 8px;
            z-index: 1;

            background-color: #f8f0e6;
            overflow: hidden;
            flex-shrink: 0;

            align-items: center;

            height: 22px;
            width: 22px;

        }
        .rtulo2 {
            position: relative;
        }
        .conta {
            width: calc(100% - 24px);
            margin: 0 !important;
            position: absolute;
            right: 0px;
            bottom: 32px;
            left: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            z-index: 2;
            flex-shrink: 0;

        .cuidados-do-pet {
