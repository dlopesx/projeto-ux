<!DOCTYPE html>
<html>
<head>
  	<meta charset="utf-8">
  	<meta name="viewport" content="initial-scale=1, width=device-width">
    <title>Primeiro Acesso</title>
  	
  	<link rel="stylesheet"  href="./index.css" />
  	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        /* Remove o botão nativo de revelar senha do Edge */
        input::-ms-reveal,
        input::-ms-clear {
            display: none;
        }

    </style>

<body>
    
    <!-- DESKTOP -->
    <section class="hidden md:grid grid-cols-[3fr_2fr] relative w-full min-h-screen overflow-hidden bg-[#FFFBF6]">

        <!-- Painel decorativo esquerdo -->
        <div class="relative flex min-w-0 min-h-screen flex-col justify-center items-start gap-9 overflow-hidden bg-[#fff6ec] p-12 lg:p-20 xl:p-28">

            <div class="self-stretch text-7xl font-semibold font-['Inter'] leading-tight text-Texto-1">
                Nome da aplicação
            </div>

            <div class="self-stretch text-2xl font-normal font-['Inter'] leading-9 text-Texto-2">
                Frase
            </div>

            <!-- Curva decorativa -->
            <div class="absolute bottom-0 left-0 w-full h-28">
                <img src="svg/curva.svg" alt=""
                    class="w-full h-full object-fill pointer-events-none" />
            </div>
        </div>

        <!-- Área do formulário -->
        <div class="flex min-w-0 min-h-screen w-full flex-col justify-center items-center overflow-y-auto p-6 lg:p-10">

            <div class="flex w-full max-w-lg flex-col items-center gap-6">

                <!-- Abas de Login e Cadastro -->
                <div class="flex w-full items-center gap-4">
                    <a href="primeiro_acesso_login.html"
                    class="flex h-12 flex-1 items-center justify-center rounded-xl bg-[#F29A4B] text-lg font-semibold text-white">
                        Log In
                    </a>

                    <a href="primeiro_acesso_cadastro.html"
                    class="flex h-12 flex-1 items-center justify-center rounded-xl text-lg font-semibold text-Texto-2">
                        Cadastro
                    </a>
                </div>

                <!-- E-mail -->
                <div class="flex h-14 w-full items-center gap-3 rounded-xl bg-[#FFFBF6] px-4 outline outline-1 outline-[#51443B]">
                    <input type="email" name="email" placeholder="E-mail"
                        class="h-full min-w-0 flex-1 border-none bg-transparent text-base font-normal text-[#2B1A0E] outline-none placeholder:text-[#51443B]" />

                    <img src="svg/@.svg" alt="" class="h-6 w-6 shrink-0 object-contain" />
                </div>

                <!-- Senha -->
                <div class="flex h-14 w-full items-center gap-3 rounded-xl bg-[#FFFBF6] px-4 outline outline-1 outline-[#51443B]">
                    <input id="senha" type="password" name="senha" placeholder="Senha"
                        class="h-full min-w-0 flex-1 border-none bg-transparent font-['Inter'] text-base text-[#2B1A0E] outline-none placeholder:text-[#51443B]" />

                    <button type="button" onclick="alternarSenha('senha')"
                            class="flex h-6 w-6 shrink-0 items-center justify-center"
                            aria-label="Mostrar ou ocultar senha">
                        <img src="svg/olho.svg" alt="" class="h-6 w-6 object-contain" />
                    </button>
                </div>

                <!-- Recuperação de senha -->
                <div class="mt-1 flex w-full justify-center">
                    <a href="#" class="text-sm font-normal leading-5 text-[#8F4B17]">
                        Esqueci a senha
                    </a>
                </div>

                <!-- Google -->
                <button type="button"
                        class="flex h-12 w-64 items-center justify-center gap-3 rounded-xl bg-[#FFFBF6] outline outline-1 outline-Borda">
                    <span class="font-['Inter'] text-base font-semibold text-Texto-1">
                        Continuar com Google
                    </span>
                </button>

                <!-- Botão Entrar -->
                <a href="index.html"
                class="flex h-12 w-64 items-center justify-center rounded-xl bg-[#F29A4B] outline outline-1 outline-Borda">
                    <span class="font-['Inter'] text-lg font-semibold text-Texto-1">
                        Entrar
                    </span>
                </a>

                <!-- Separador -->
                <div class="flex w-full items-center gap-4">
                    <div class="h-px flex-1 bg-Borda"></div>
                    <span class="font-['Inter'] text-sm font-normal text-[#2B1A0E]">ou</span>
                    <div class="h-px flex-1 bg-Borda"></div>
                </div>

                <!-- Acesso sem cadastro -->
                <a href="index.html"
                class="text-center font-['Inter'] text-sm font-normal leading-5 text-[#2B1A0E]">
                    Continuar sem cadastro
                </a>

            </div>
        </div>
    </section>

    <!-- MOBILE -->
    <section class="block md:hidden">

        <!-- TELA DE ABERTURA -->
        <div
            id="telaAbertura"
            class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#FFFBF6]">
            <img
                src="svg/logo-bichinho-icone 1.svg"
                alt="Logo da aplicação"
                class="w-32 h-32 object-contain"
            />
        </div>

        <!-- Primeiro acesso/ Tela inicial -->
        <div id="telaInicial" class="hidden w-full">

            <div class="relative w-full min-h-dvh flex flex-col overflow-hidden bg-[#FFFBF6]">

                <div class="relative flex min-h-[55dvh] w-full flex-col items-start gap-6 overflow-hidden bg-[#FFF6EC] px-8 pt-28">

                    <h1 class="text-5xl font-semibold font-['Inter'] leading-10 text-[#2B1A0E]">
                        Nome<br />
                        da<br />
                        aplicação
                    </h1>

                    <p class="text-lg font-normal font-['Inter'] text-[#8F7662]">
                        Frase
                    </p>

                    <div class="absolute bottom-0 left-0 w-full h-12 pointer-events-none">
                        <img
                            src="svg/curvaMobile.svg"
                            alt=""
                            class="w-full object-fill h-[50px]"
                        />
                    </div>

                </div>

                <div class="flex w-full flex-1 flex-col items-stretch gap-3.5 px-6 pt-9 pb-10">

                    <a
                        href="primeiro_acesso_cadastro.html"
                        class="flex h-12 w-full items-center justify-center rounded-xl border border-[#F29A4B] bg-[#F29A4B] px-5"
                    >
                        <span class="text-xl font-semibold font-['Inter'] text-[#2B1A0E]">
                            Cadastrar
                        </span>
                    </a>

                    <button
                        type="button" 
                        onclick="mostrarTela('telaLogin')"
                        class="flex h-12 w-full items-center justify-center rounded-xl border border-[#E9DDCF] bg-[#EEEE88] px-5">
                        <span class="text-xl font-semibold font-['Inter'] text-[#8F4B17]">
                            Já possuo uma conta
                        </span>
                    </button>

                    <button
                        type="button"
                        class="w-full text-center text-sm font-normal font-['Inter'] leading-5 text-[#2B1A0E]">
                        Continuar sem cadastro
                    </button>

                </div>

            </div>
        </div>


        <!-- Tela Login -->
        <div id="telaLogin" class="hidden relative w-full h-dvh bg-[#FFFBF6] flex-col overflow-hidden">

            <div class="h-16 shrink-0 px-6 border-b border-Borda flex items-center gap-4">
                <a href="#" onclick="mostrarTela('telaInicial'); return false;"
                class="size-6 flex items-center justify-center">
                    <img src="svg/voltar.svg" alt="Voltar" class="w-6 h-6 object-contain">
                </a>
                <h1 class="text-Texto-1 text-lg font-semibold font-['Inter']">Login</h1>
            </div>

            <div class="p-6 flex flex-col gap-7">
                <h2 class="text-Texto-1 text-2xl font-semibold font-['Inter'] leading-8">
                    Que bom ter você de volta :)
                </h2>

                <div class="flex flex-col gap-3.5">
                    <div class="h-12 px-3.5 bg-[#F8F0E6] rounded-xl border border-[#E9DDCF] flex items-center gap-3">
                        <input type="email" placeholder="E-mail"
                            class="w-full min-w-0 bg-transparent outline-none text-Texto-1 text-base font-['Inter'] placeholder:text-Texto-2">
                        <img src="svg/@.svg" alt="" class="w-4 h-4 object-contain shrink-0">
                    </div>

                    <div class="h-12 px-3.5 bg-[#F8F0E6] rounded-xl border border-[#E9DDCF] flex items-center gap-3">
                        <input id="senha" type="password" placeholder="Senha"
                            class="w-full min-w-0 bg-transparent outline-none text-Texto-1 text-base font-['Inter'] placeholder:text-Texto-2">
                        <button type="button" onclick="alternarSenha()"
                                class="shrink-0 flex items-center justify-center">
                            <img src="svg/olho.svg" alt="Mostrar ou ocultar senha"
                                class="w-4 h-4 object-contain">
                        </button>
                    </div>

                    <a href="#" class="self-end text-[#8F4B17] text-xs font-normal font-['Inter']">
                        Esqueci a senha
                    </a>
                </div>

                <button type="button"
                        class="w-full h-12 px-5 bg-[#FFFBF6] rounded-xl border border-[#E9DDCF] flex justify-center items-center">
                    <span class="text-Texto-1 text-base font-semibold font-['Inter']">
                        Continuar com Google
                    </span>
                </button>
            </div>

            <div class="absolute bottom-6 left-6 right-6">
                <button type="button"
                    onclick="window.location.href='index.html'"
                    class="w-full h-12 bg-[#F5A04B] rounded-xl border border-[#F5A04B] flex justify-center items-center">
                    <span class="text-Texto-1 text-base font-semibold font-['Inter']">
                        Entrar
                    </span>
                </button>
            </div>

        </div>

    </section>

    
    <script>
        function alternarSenha() {
            const campoSenha = document.getElementById("senha");

            if (campoSenha.type === "password") {
                campoSenha.type = "text";
            } else {
                campoSenha.type = "password";
            }
        }

        setTimeout(() => {
            document.getElementById("telaAbertura").classList.add("hidden");
            document.getElementById("telaInicial").classList.remove("hidden");
        }, 5000); //5000

        function mostrarTela(idTela) {
            // Lista todas as telas do fluxo
            const telas = [
                "telaInicial",
                "telaLogin"
            ];

            // Esconde todas as telas
            telas.forEach(id => {
                document.getElementById(id).classList.add("hidden");
            });

            // Mostra apenas a tela escolhida
            document.getElementById(idTela).classList.remove("hidden");
        }
    </script>


</body>
