<!DOCTYPE html>
<html>
<head>
  	<meta charset="utf-8">
  	<meta name="viewport" content="initial-scale=1, width=device-width">
    <title>Primeiro Acesso</title>
  	
  	<link rel="stylesheet"  href="./index.css" />
  	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
    <script src="https://cdn.tailwindcss.com"></script>

<body>
    

    <div class="relative bg-Fundo justify-start items-start overflow-hidden bg-[#FFFBF6] grid grid-cols-[3fr_2fr] w-full min-h-screen">
        <div class="min-w-0 min-h-screen p-28 relative bg-ondasFundo inline-flex flex-col justify-center items-start gap-9 overflow-hidden bg-[#fff6ec]">
            <div class="self-stretch justify-start text-Texto-1 text-7xl font-semibold font-['Inter'] leading-[77.76px]">
                Nome da aplicação
            </div>
            <div class="self-stretch justify-start text-Texto-2 text-2xl font-normal font-['Inter'] leading-9">
                Frase
            </div>
            <div class="w-[800px] h-28 left-0 top-[780px] absolute bg-Fundo"></div>
        </div>
        
        <div class="min-w-0 min-h-screen w-full p-10 flex flex-col justify-center items-center overflow-hidden">

            <div class="w-full max-w-lg flex flex-col items-center gap-6">

                <!-- Abas de Login e Cadastro -->
                <div class="w-full flex items-center gap-4">
                    <div class="flex-1 h-12 bg-Botão-1 rounded-[20px] flex justify-center items-center">
                        <span class="text-black text-lg font-semibold font-['Inter'] w-full h-12 bg-[#F29A4B] text-white rounded-xl font-semibold">
                            Log In
                        </span>
                    </div>

                    <div class="flex-1 h-12 flex justify-center items-center">
                        <span class="text-Texto-2 text-lg font-semibold font-['Inter']">
                            Cadastro
                        </span>
                    </div>
                </div>

                <!-- E-mail -->
                <div class="w-full flex flex-col gap-2">
                    <div class="w-full h-14 px-4 bg-Superficie rounded-xl outline outline-1 outline-Borda flex items-center">
                        <span class="text-Texto-2 text-base font-normal font-['Inter']">
                            E-mail
                        </span>
                    </div>
                </div>

                <!-- Senha -->
                <div class="w-full flex flex-col gap-2">
                    <div class="w-full h-14 px-4 bg-Superficie rounded-xl outline outline-1 outline-Borda flex justify-between items-center">
                        <span class="text-Texto-2 text-base font-normal font-['Inter']">
                            Senha
                        </span>

                        <div class="w-6 h-5 outline outline-2 outline-CorTexto1"></div>
                    </div>
                </div>

                <!-- Recuperação de senha -->
                <div class="w-full flex justify-end">
                    <span class="text-Texto-3 text-sm font-normal font-['Inter'] leading-5">
                        Esqueci a senha
                    </span>
                </div>

                <!-- Botão Entrar -->
                <div class="w-full h-12 bg-Botão-1 rounded-xl flex justify-center items-center">
                    <span class="text-Texto-1 text-lg font-semibold font-['Inter']">
                        Entrar
                    </span>
                </div>

                <!-- Separador -->
                <div class="w-full flex items-center gap-3">
                    <div class="flex-1 h-px bg-Borda"></div>
                    <span class="text-Texto-1 text-sm font-normal font-['Inter']">
                        ou
                    </span>
                    <div class="flex-1 h-px bg-Borda"></div>
                </div>

                <!-- Google -->
                <div class="w-full h-12 px-4 bg-Fundo rounded-xl outline outline-1 outline-Borda flex justify-center items-center gap-3">
                    <span class="text-Texto-1 text-base font-semibold font-['Inter']">
                        Continuar com Google
                    </span>
                </div>

                <!-- Acesso sem cadastro -->
                <div class="w-full text-center">
                    <span class="text-Texto-1 text-sm font-normal font-['Inter'] leading-5">
                        Continuar sem cadastro
                    </span>
                </div>

            </div>
        </div>

    </div>

</body>
