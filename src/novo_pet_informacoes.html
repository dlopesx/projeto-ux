<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fundo: '#FFFBF6',
                        superficie: '#F8F0E6',
                        botao2: '#EEEE88',
                        borda: '#E9DDCF',
                        laranja: '#F29A4B',
                        texto1: '#2B1A0E',
                        texto2: '#75634F',
                        texto3: '#8F4B17',
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                },
            },
        }
    </script>

</head>
<body>

    <!-- MOBILE -->
    <section class="block md:hidden">
        <div id="informacoes" class="min-h-screen w-full relative bg-fundo flex flex-col overflow-hidden">

            <header class="h-16 shrink-0 px-6 border-b border-borda flex items-center gap-4">
                <button type="button" onclick="history.back()" aria-label="Voltar" class="size-5 flex items-center justify-center">
                    <img src="svg/voltar.svg" alt="Figura de voltar laranja" class="w-5 h-5">
                </button>
                <span class="text-texto2 text-lg font-semibold">Novo pet</span>
            </header>

            <div class="px-6 pt-5 pb-1 flex gap-1.5">
                <div class="flex-1 h-[5px] bg-texto2 rounded-full"></div>
                <div class="flex-1 h-[5px] bg-texto2 rounded-full"></div>
                <div class="flex-1 h-[5px] bg-texto2 rounded-full"></div>
                <div class="flex-1 h-[5px] bg-texto2 rounded-full"></div>
                <div class="flex-1 h-[5px] bg-borda rounded-full"></div>
            </div>

            <form id="form-informacoes" class="flex-1 p-6 flex flex-col gap-6 pb-28">

                <div class="flex flex-col gap-2">
                    <h1 class="text-texto1 text-2xl font-semibold leading-8">Quase lá!</h1>
                    <p class="text-texto3 text-base leading-6">
                        Preencha informações adicionais sobre o(a)
                        <span id="nome-pet">seu pet</span>.
                    </p>
                </div>

                <div class="flex flex-col gap-2">
                    <label for="cor-pet" class="text-texto3 text-sm font-medium">Cor</label>
                    <input
                        type="text"
                        id="cor-pet"
                        name="cor"
                        placeholder="Ex.: caramelo, preto e branco"
                        class="w-full h-12 px-3.5 bg-superficie rounded-xl border border-borda text-texto1 placeholder:text-borda outline-none focus:border-laranja"
                    >
                </div>

                <div class="flex flex-col gap-2">
                    <label for="peso-pet" class="text-texto3 text-sm font-medium">Peso (kg)</label>
                    <input
                        type="number"
                        id="peso-pet"
                        name="peso"
                        placeholder="Ex.: 5,5"
                        min="0"
                        step="0.1"
                        class="w-full h-12 px-3.5 bg-superficie rounded-xl border border-borda text-texto1 placeholder:text-borda outline-none focus:border-laranja"
                    >
                </div>

                <fieldset class="flex flex-col gap-3">
                    <legend class="text-texto3 text-base font-semibold mb-3">O pet é adotado?</legend>
                    <div class="flex items-center gap-8">
                        <label class="flex items-center gap-2.5 text-texto2 cursor-pointer">
                            <input type="radio" name="adotado" value="sim" class="size-5 accent-laranja">
                            Sim
                        </label>
                        <label class="flex items-center gap-2.5 text-texto2 cursor-pointer">
                            <input type="radio" name="adotado" value="nao" class="size-5 accent-laranja">
                            Não
                        </label>
                    </div>
                </fieldset>

                <fieldset class="flex flex-col gap-3">
                    <legend class="text-texto3 text-base font-semibold mb-3">O pet é castrado?</legend>
                    <div class="flex items-center gap-8">
                        <label class="flex items-center gap-2.5 text-texto2 cursor-pointer">
                            <input type="radio" name="castrado" value="sim" class="size-5 accent-laranja">
                            Sim
                        </label>
                        <label class="flex items-center gap-2.5 text-texto2 cursor-pointer">
                            <input type="radio" name="castrado" value="nao" class="size-5 accent-laranja">
                            Não
                        </label>
                    </div>
                </fieldset>

            </form>

            <footer class="fixed bottom-0 left-0 right-0 p-6 pt-3 bg-fundo">
                <button
                    type="submit"
                    form="form-informacoes"
                    class="w-full h-12 px-5 bg-laranja rounded-xl flex justify-center items-center text-texto1 text-base font-semibold"
                >
                    Avançar
                </button>
            </footer>

        </div>
    </section>


    <script>
        const nomePet = sessionStorage.getItem('nomePet');

        if (nomePet) {
            document.getElementById('nome-pet').textContent = nomePet;
        }

        document.getElementById('form-informacoes').addEventListener('submit', function (event) {
            event.preventDefault();

            const cor = document.getElementById('cor-pet').value.trim();
            const peso = document.getElementById('peso-pet').value;
            const adotado = document.querySelector('input[name="adotado"]:checked');
            const castrado = document.querySelector('input[name="castrado"]:checked');

            const informacoesPet = {
                cor: cor,
                peso: peso,
                adotado: adotado ? adotado.value : '',
                castrado: castrado ? castrado.value : ''
            };

            sessionStorage.setItem('informacoesPet', JSON.stringify(informacoesPet));

            window.location.href = 'novo_pet_foto.html';
        });
    </script>


</body>
</html>
