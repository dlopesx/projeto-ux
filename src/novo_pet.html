<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <div class="flex">

        <!-- SIDEBAR-->

        <aside id="default-sidebar" class=" bg-[#F8F0E6] p-3 flex flex-col shrink-0 w-60 min-h-screen " aria-label="Sidebar">
            <div class=" flex flex-col flex-1 px-3 py-4 justify-between bg-neutral-primary-soft">
                <ul class=" flex-1 space-y-2 font-medium">
                    <li class="flex">
                        <a href="#" class="flex flex-1 items-center px-2 py-3  rounded-2xl  group">
                        <span class="px-1 pb-6 text-xl font-bold">Site nome</span>
                        </a>
                        <button> <img class="pb-6" src = "svg/fechar.svg" alt="X cinza para fechar menu lateral"/></button>
                    </li>

                    <!-- PERFIL DO USUÁRIO -->
                    <li class="pb-3 mb-2 border-b border-[#E9DDCF]">
                        <a href="#" aria-label="Perfil de Marina" class="group flex items-center gap-3 px-2 py-2 rounded-2xl hover:bg-[#E9DDCF]">
                            <span class="w-10 h-10 shrink-0 rounded-full bg-[#E9DDCF] group-hover:bg-[#F8F0E6] flex items-center justify-center font-semibold transition" aria-hidden="true">M</span>
                            <span class="flex-1 min-w-0 font-semibold truncate">Marina</span>
                        </a>
                    </li>

                    <li class="relative">
                        <span class="absolute left-0 top-1/2 -translate-y-1/2 h-10 w-1.5 rounded-r bg-[#F29A4B]"></span>
                        <a href="index.html" class="flex items-center px-2 py-3 pl-6 rounded-xl hover:bg-[#E9DDCF]  group">
                        <img src = "svg/inicio.svg" alt="Figura de uma casa na cor laranja"/>
                        <span class="flex-1 ms-3 whitespace-nowrap">Início</span>
                        </a>
                    </li>
                    <li>
                        <a href="meus_pets.html" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                        <img src = "svg/paw-print.svg" a    lt="Pata de animal na cor laranja"/>
                        <span class="flex-1 ms-3 whitespace-nowrap">Meus pets</span>
                        </a>
                    </li>
                    <li>
                        <a href="meus_agendamentos.html" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                        <img src = "svg/calendario.svg" alt="Calendario na cor laranja"/>

                        <span class="flex-1 ms-3 whitespace-nowrap">Agendamentos</span>
                        </a>
                    </li>
                    <li>
                        <a href="meus_alertas.html" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                        <img src = "svg/notificacao.svg" alt="Sino de alerta na cor laranja"/>

                        <span class="flex-1 ms-3 whitespace-nowrap">Alertas</span>
                        </a>
                    </li>
                    <li>
                        <a href="tutores.html" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                        <img src = "svg/tutores.svg" alt="Figura de usuários na cor laranja"/>
                        <span class="flex-1 ms-3 whitespace-nowrap">Outros tutores</span>
                        </a>
                    </li>
                </ul>

                <!-- RODAPÉ DA SIDEBAR-->
                <ul class=" mt-auto space-y-2 py-5 border-t border-[#E9DDCF] ">
                    <li>
                        <a href="#" class="flex items-center gap-2 px-2 py-3 rounded-2xl hover:bg-[#E9DDCF]"> <img src = "svg/info.svg" alt="Símbolo de informação em laranja"/>Sobre</a>
                    </li>
                    <li>
                        <a href="#" class="flex items-center gap-2 px-2 py-3 rounded-2xl hover:bg-[#E9DDCF]"><img src = "svg/help-circle.svg" alt="Símbolo de ajuda em laranja"/>Ajuda</a>
                        
                    </li>
                </ul>
                
            </div>
        </aside>

        <!-- HEADER E MAIN -->

        <div class=" bg-[#FFFBF6] flex flex-col self-stretch flex-1"> 

            <header class="flex flex-row justify-between p-5 border ">
                <a href="index.html" class="flex gap-4">
                    <img alt="Figura de seta laranja" src="svg/voltar.svg">
                    <p> Voltar</p>
                </a>
                <button> <img src = "svg/notificacao.svg" alt="Símbolo de informação em laranja"/> </button>
            </header>

            
            <main class="flex w-full py-8 px-16 flex items-start self-stretch">
                
                <div class="grid grid-cols-1 md:grid-cols-[20rem_60rem] gap-20 w-full">

                    <!-- NAVEGAÇÃO ENTRE ETAPAS -->
                    <div class="flex flex-col gap-9 p-9">
                        <h3 class= " flex items-start self-stretch font-semibold"> NOVO PET </h3>
                        <div class="flex items-center gap-4">
                            <div class="rounded-full w-9 h-9 shrink-0 bg-[#F8F0E6] border border-[#E9DDCF] flex justify-center items-center">1</div>
                            <p> Nome e espécie </p>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="rounded-full w-9 h-9 shrink-0 bg-[#F8F0E6] border border-[#E9DDCF] flex justify-center items-center">2</div>
                            <p> Raça </p>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="rounded-full w-9 h-9 shrink-0 bg-[#F8F0E6] border border-[#E9DDCF] flex justify-center items-center">3</div>
                            <p> Nascimento </p>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="rounded-full w-9 h-9 shrink-0 bg-[#F8F0E6] border border-[#E9DDCF] flex justify-center items-center">4</div>
                            <p> Informações adicionais </p>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="rounded-full w-9 h-9 shrink-0 bg-[#F8F0E6] border border-[#E9DDCF] flex justify-center items-center">5</div>
                            <p> Foto </p>
                        </div>
                    </div>

                    <!-- FORMULARIO -->
                    <div class=" flex flex-col self-stretch w-full gap-12 border p-9 border-[#E9DDCF] rounded-3xl ">
                        <label for="nome_pet">
                            <h1 class= " flex items-start self-stretch text-4xl font-semibold"> Qual o nome do pet?</h1>
                        </label>
                        <input id="nome_pet"  name="nome_pet" class="w-130 h-10 px-5 bg-[#F8F0E6] border border-[#E9DDCF] rounded-2xl">

                        <div class="flex gap-4 flex-col">
                            <h3> Selecione a espécie: </h3>
                            <div class="flex gap-3">
                                <div class="border border-[#E9DDCF] bg-[#F8F0E6] px-4 py-1 rounded-2xl">
                                    <input type="radio" id="cachorro" class="hidden peer" type="radio" name="especie" value="cachorro" class="hidden peer">
                                    <label for="especie"> Cachorro </label>
                                </div>
                                <div class="border border-[#E9DDCF] bg-[#F8F0E6] px-4 py-1 rounded-2xl">
                                    <input type="radio" id="gato" class="hidden peer" type="radio" name="especie" value="gato" class="hidden peer">
                                    <label for="especie"> Gato </label>
                                </div>
                                <div class="border border-[#E9DDCF] bg-[#F8F0E6] px-4 py-1.5 rounded-2xl">
                                    <input type="radio" id="passaro" class="hidden peer" type="radio" name="especie" value="passaro" class="hidden peer">
                                    <label for="especie"> Pássaro </label>
                                </div>
                                <div class="border border-[#E9DDCF] bg-[#F8F0E6] px-4 py-1 rounded-2xl">
                                    <input type="radio" id="peixe" class="hidden peer" type="radio" name="especie" value="peixe" class="hidden peer">
                                    <label for="especie"> Peixe </label>
                                </div>
                                <div class="border border-[#E9DDCF] bg-[#F8F0E6] px-4 py-1 rounded-2xl">
                                    <input type="radio" id="roedor" class="hidden peer" type="radio" name="especie" value="roedor" class="hidden peer">
                                    <label for="especie"> Roedor </label>
                                </div>
                                <div class="border border-[#E9DDCF] bg-[#F8F0E6] px-4 py-1 rounded-2xl">
                                    <input type="radio" id="reptil" class="hidden peer" type="radio" name="especie" value="reptil" class="hidden peer">
                                    <label for="especie"> Réptil </label>
                                </div>
                                <div class="border border-[#E9DDCF] bg-[#F8F0E6] px-4 py-1 rounded-2xl">
                                    <input type="radio" id="outro" class="hidden peer" type="radio" name="especie" value="outro" class="hidden peer">
                                    <label for="especie"> Outro </label>
                                </div>
                            </div>
                         </div>

                         <div class="flex flex-col gap-4">
                             <h3> Sexo: </h3>
                             <div class="flex gap-3">
                                <div class="border border-[#E9DDCF] bg-[#F8F0E6] px-4 py-1 rounded-2xl">
                                    <input type="radio" id="femea" class="hidden peer" type="radio" name="especie" value="femea" class="hidden peer">
                                    <label for="especie"> Fêmea </label>
                                </div>
                                <div class="border border-[#E9DDCF] bg-[#F8F0E6] px-4 py-1 rounded-2xl">
                                    <input type="radio" id="macho" class="hidden peer" type="radio" name="especie" value="macho" class="hidden peer">
                                    <label for="especie"> Macho </label>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="flex bg-[#F29A4B] w-40 px-4 py-3 gap-4 rounded-2xl items-center justify-center hover:bg-[#E8863A] hover:shadow-md transition transition" > 
                            Avançar 
                        </button>
                     </div>
                        
                    </div>
        
            </main>

        </div>
        


    </div>


</body>
</html>
