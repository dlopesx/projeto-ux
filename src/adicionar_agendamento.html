<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar agendamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        .flatpickr-calendar.inline { width: 100%; max-width: 100%; box-shadow: none; background: transparent; }
        .flatpickr-innerContainer, .flatpickr-rContainer, .flatpickr-days, .dayContainer { width: 100%; min-width: 100%; max-width: 100%; }
        .flatpickr-day { max-width: none; }
        .flatpickr-day.selected, .flatpickr-day.selected:hover { background: #F29A4B; border-color: #F29A4B; color: #2B1B10; }
        .flatpickr-day.today { border-color: #F29A4B; }
        .flatpickr-day:hover { background: #F8F0E6; border-color: #F8F0E6; }
        .flatpickr-prev-month svg, .flatpickr-next-month svg { fill: #F29A4B; }
    </style>
        
</head>
<body>

    <div class="flex">

        <!-- SIDEBAR-->

 <!-- SIDEBAR-->

        <aside id="default-sidebar" class=" bg-[#F8F0E6] p-3 flex flex-col shrink-0 w-60 min-h-screen " aria-label="Sidebar">
            <div class=" flex flex-col flex-1 px-3 py-4 justify-between bg-neutral-primary-soft">
                <ul class=" flex-1 space-y-2 font-medium">
                    <li class="flex">
                        <a href="#" class="flex flex-1 items-center px-2 py-3  rounded-2xl  group">
                        <span class="px-1 pb-6 text-xl font-bold">Site nome</span>
                        </a>
                        <button> <img class="pb-6" src = "svg/fechar.svg" alt="X cinza para fechar menu lateral"/></button>
                    </li>
                    <li dir="ltr">
                        <a href="#" class="border-l-4 border-l-[#F29A4B] flex items-center px-2 py-3  rounded-xl hover:bg-[#E9DDCF]  group">
                        <img src = "svg/inicio.svg" alt="Figura de uma casa na cor laranja"/>
                        <span class="flex-1 ms-3 whitespace-nowrap">Início</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                        <img src = "svg/paw-print.svg" a    lt="Pata de animal na cor laranja"/>
                        <span class="flex-1 ms-3 whitespace-nowrap">Meus pets</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                        <img src = "svg/calendario.svg" alt="Calendario na cor laranja"/>

                        <span class="flex-1 ms-3 whitespace-nowrap">Agendamentos</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                        <img src = "svg/notificacao.svg" alt="Sino de alerta na cor laranja"/>

                        <span class="flex-1 ms-3 whitespace-nowrap">Alertas</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="flex items-center px-2 py-3  rounded-2xl hover:bg-[#E9DDCF]  group">
                        <img src = "svg/tutores.svg" alt="Figura de usuários na cor laranja"/>
                        <span class="flex-1 ms-3 whitespace-nowrap">Outros tutores</span>
                        </a>
                    </li>
                </ul>

                <!-- RODAPÉ DA SIDEBAR-->
                <ul class=" mt-auto space-y-2 py-5 border-t border-[#E9DDCF] ">
                    <li>
                        <a href="#" class="flex items-center gap-2 px-2 py-3 rounded-2xl hover:bg-[#E9DDCF]"> <img src = "svg/info.svg" alt="Símbolo de informação em laranja"/>Sobre</a>
                    </li>
                    <li>
                        <a href="#" class="flex items-center gap-2 px-2 py-3 rounded-2xl hover:bg-[#E9DDCF]"><img src = "svg/help-circle.svg" alt="Símbolo de ajuda em laranja"/>Ajuda</a>
                        
                    </li>
                </ul>
                   
            </div>
        </aside>

        <!-- HEADER E MAIN -->

        <div class=" bg-[#FFFBF6] flex flex-col self-stretch flex-1"> 

            <header class="flex flex-row justify-between p-5 border ">
                <p> Voltar</p>
                <button> <img src = "svg/notificacao.svg" alt="Símbolo de informação em laranja"/> </button>
            </header>

            
            <main class="flex w-full py-8 px-16 flex-col items-start self-stretch">
                
                <div class="flex flex-col items-center self-stretch gap-3">
                    <div class="flex justify-between self-stretch items-center">
                        <h1 class= " flex items-start self-stretch text-4xl font-semibold"> Novo agendamento </h1>
                    </div>
                    
                    <div class="flex self-stretch">

                        <form method="post" action="#" class="flex flex-col lg:flex-row items-start gap-16 w-full">

                            <!-- CALENDARIO e HORARIO-->
                            <div class="flex flex-col gap-6 w-full lg:w-[26rem] shrink-0">

                                <div class="">
                                    <input id="data"  name="data" class="w-130 h-5 px-5 bg-[#F8F0E6] border border-[#E9DDCF] rounded-md">
                                </div>

                                <div class="flex flex-col gap-3"> 
                                     <label for="horario"> Horário </label>
                                     <input id="horario" name="horario" type="text" placeholder="00:00"
                                            class="w-full h-14 px-5 bg-[#F8F0E6] border border-[#E9DDCF] rounded-2xl ">
                                </div>
                                
                            </div>

                            <!-- PREENCHIMENTOS -->
                            <div class="flex flex-col flex-1 gap-3 p-5 border border-[#E9DDCF] rounded-2xl">
                                <div class="flex flex-col gap-6"> 
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5"> 
                                        <div class="flex flex-col gap-3">
                                            <label for="profissional" > Profissional </label>
                                            <input id="profissional" name="profissional" class="w-full h-14 bg-[#F8F0E6] rounded-2xl">
                                        </div>
                                        <div class="flex flex-col gap-3">
                                            <label for="crm"> CRM (opcional)</label>
                                            <input id="crm" name="crm" class="w-full h-14 bg-[#F8F0E6] rounded-2xl">
                                        </div>
                                    </div>
                                    <div class="flex flex-col gap-3">
                                        <div class="flex flex-col gap-2">
                                            <label for="estabelecimento"> Estabelecimento (opcional)</label>
                                            <input id="estabelecimento" name="estabelecimento" class="w-full h-14 bg-[#F8F0E6] rounded-2xl">
                                        </div>
                                        <div class="flex flex-col gap-2">
                                            <label for="endereco"> Endereço (opcional) </label>
                                            <input id="endereco" name="endereco" class="w-full h-14 bg-[#F8F0E6] rounded-2xl">
                                        </div>
                                        <div class="flex flex-col gap-2">
                                            <label for="obs"> Observações/motivo </label>
                                            <textarea id="obs" name="obs"
                                                class="w-full h-28 px-5 py-4 bg-[#F8F0E6] border border-[#E9DDCF] rounded-2xl"></textarea>
                                        </div>
                                    </div>
                                </div>
                                
                                <button type="submit" class="flex bg-[#F29A4B] w-40 px-4 py-3 gap-4 rounded-2xl font-semibold hover:bg-[#E8863A] hover:shadow-md transition transition" > 
                                <img src = "svg/adicionar.svg" alt="Botão de 'Mais'"/>
                                Adicionar 
                                </button>
                            </div>
                            
                        </form>
                            
                    </div>
                
        
                </div>
                
        
            </main>

        </div>
        


    </div>
    <div>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
        <script>
            flatpickr("#data", { locale: "pt", minDate: "today", inline: true});
            flatpickr("#horario", {
                        enableTime: true,
                        noCalendar: true,
                        dateFormat: "H:i",
                        time_24hr: true,
                        minuteIncrement: 1
                    });
        </script>
    </div>
</body>
</html>
