    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">





    <style type="text/tailwindcss">

        .flatpickr-calendar.inline { width: 100%; max-width: 100%; box-shadow: none; background: transparent; }

        .flatpickr-innerContainer, .flatpickr-rContainer, .flatpickr-days, .dayContainer { width: 100%; min-width: 100%; max-width: 100%; }

        .flatpickr-day { max-width: none; }

        .flatpickr-day.selected, .flatpickr-day.selected:hover { background: #F29A4B; border-color: #F29A4B; color: #2B1B10; }

        .flatpickr-day.today { border-color: #F29A4B; }

        .flatpickr-day:hover { background: #F8F0E6; border-color: #F8F0E6; }

        .flatpickr-prev-month svg, .flatpickr-next-month svg { fill: #F29A4B; }



        @layer components {

            .campo {

                @apply bg-[#F8F0E6] border border-[#E9DDCF] rounded-2xl outline-none transition

                focus:ring-2 focus:ring-[#F29A4B] disabled:opacity-50 disabled:cursor-not-allowed;

            }

        }

        /* Remove o relógio padrão do campo de horário no Chrome/Edge */
        input[type="time"]::-webkit-calendar-picker-indicator {
            display: none;
            -webkit-appearance: none;
        }

        /* Remove a aparência nativa do campo */
        input[type="time"] {
            appearance: none;
            -webkit-appearance: none;
        }


    </style>

    <script>
        flatpickr("#data", {
            locale: "pt",
            minDate: "today",
            inline: true
        });

        flatpickr("#horario", {
            locale: "pt",
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            time_24hr: true,
            minuteIncrement: 1
        });

        flatpickr("#data-mobile", {
            locale: "pt",
            minDate: "today",
            inline: true,
            appendTo: document.getElementById("calendario-mobile")
        });

        flatpickr("#horario-mobile", {
            locale: "pt",
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            time_24hr: true,
            minuteIncrement: 1,
            disableMobile: true
        });

        function configurarFormulario(formId, painelId, fecharId) {
            const form = document.getElementById(formId);
            const painel = document.getElementById(painelId);
            const fechar = document.getElementById(fecharId);

            if (!form || !painel || !fechar) {
                return;
            }

            let timer;

            function esconder() {
                clearTimeout(timer);
                painel.classList.add("hidden");
                painel.classList.remove("flex");
            }

            function mostrar() {
                painel.classList.remove("hidden");
                painel.classList.add("flex");

                clearTimeout(timer);
                timer = setTimeout(esconder, 5000);
            }

            form.addEventListener("submit", function (e) {
                e.preventDefault();

                if (!form.reportValidity()) {
                    return;
                }

                mostrar();
            });

            fechar.addEventListener("click", esconder);
        }

        configurarFormulario(
            "form-agendamento",
            "agendamento-adicionado",
            "bt-fechar"
        );

        configurarFormulario(
            "form-agendamento-mobile",
            "agendamento-adicionado-mobile",
            "bt-fechar-mobile"
        );

        /* Relógio laranja do formulário mobile */
        const relogio = document.getElementById("relogio");
        const horarioMobile = document.getElementById("horario-mobile");

        relogio.addEventListener("click", function () {
            horarioMobile._flatpickr.open();
        });
    </script>
