<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peso - Fiu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss"> 
            @layer components {
                .campo {
                    @apply w-full h-12 px-4 bg-[#F8F0E6] border border-[#E9DDCF] rounded-2xl outline-none transition
                    focus:ring-2 focus:ring-[#F29A4B] disabled:opacity-50 disabled:cursor-not-allowed;
        }
    }

    </style>
</head>
<body>

    <!--DESKTOP-->
    <section class="hidden md:block">
        <div class="flex">

            <!-- SIDEBAR-->

            <aside id="default-sidebar" class=" bg-[#F8F0E6] p-3 flex flex-col shrink-0 w-60 min-h-dvh " aria-label="Sidebar">
                <div class="flex flex-col flex-1 px-3 py-4 justify-between bg-neutral-primary-soft">
                    <ul class="flex-1 space-y-2 font-medium">
                        <li class="flex">
                            <a href="#" class="flex flex-1 items-center px-2 py-3 rounded-2xl group">
                                <span class="px-1 pb-6 text-xl font-bold">Site nome</span>
                            </a>
                            <button> <img class="w-6 h-6 mb-6" src="../svg/fechar.svg" alt="X cinza para fechar menu lateral"/></button>
                        </li>

                        <!-- PERFIL DO USUÁRIO -->
                        <li class="pb-3 mb-2 border-b border-[#E9DDCF]">
                            <a href="#" aria-label="Perfil de Marina" class="group flex items-center gap-3 px-2 py-2 rounded-2xl hover:bg-[#E9DDCF]">
                                <span class="w-10 h-10 shrink-0 rounded-full bg-[#E9DDCF] group-hover:bg-[#F8F0E6] flex items-center justify-center font-semibold transition" aria-hidden="true">M</span>
                                <span class="flex-1 min-w-0 font-semibold truncate">Marina</span>
                            </a>
                        </li>

                        <li>
                            <a href="index.html" class="flex items-center px-2 py-3 rounded-xl hover:bg-[#E9DDCF] group">
                                <img class="w-6 h-6" src="../svg/inicio.svg" alt="Figura de uma casa na cor laranja"/>
                                <span class="flex-1 ms-3 whitespace-nowrap">Início</span>
                            </a>
                        </li>
                        <li class="relative">
                            <span class="absolute left-0 top-1/2 -translate-y-1/2 h-10 w-1.5 rounded-r bg-[#F29A4B]"></span>
                            <a href="meus_pets.html" class="flex items-center px-2 py-3 pl-6 rounded-2xl hover:bg-[#E9DDCF] group" aria-current="page">
                                <img class="w-6 h-6" src="../svg/paw-print.svg" alt="Pata de animal na cor laranja"/>
                                <span class="flex-1 ms-3 whitespace-nowrap">Meus pets</span>
                            </a>
                        </li>
                        <li>
                            <a href="meus_agendamentos.html" class="flex items-center px-2 py-3 rounded-2xl hover:bg-[#E9DDCF] group">
                                <img class="w-6 h-6" src="../svg/calendario.svg" alt="Calendario na cor laranja"/>
                                <span class="flex-1 ms-3 whitespace-nowrap">Agendamentos</span>
                            </a>
                        </li>
                        <li>
                            <a href="meus_alertas.html" class="flex items-center px-2 py-3 rounded-2xl hover:bg-[#E9DDCF] group">
                                <img class="w-6 h-6" src="../svg/notificacao.svg" alt="Sino de alerta na cor laranja"/>
                                <span class="flex-1 ms-3 whitespace-nowrap">Alertas</span>
                            </a>
                        </li>
                        <li>
                            <a href="tutores.html" class="flex items-center px-2 py-3 rounded-2xl hover:bg-[#E9DDCF] group">
                                <img class="w-6 h-6" src="../svg/tutores.svg" alt="Figura de usuários na cor laranja"/>
                                <span class="flex-1 ms-3 whitespace-nowrap">Outros tutores</span>
                            </a>
                        </li>
                    </ul>

                </div>
            </aside>

            <!-- HEADER E MAIN -->

            <div class=" bg-[#FFFBF6] flex flex-col self-stretch flex-1"> 

                <header class="flex flex-row justify-between p-5 border ">
                    <a href="../fiu.html" class="flex gap-4">
                        <img alt="Figura de seta laranja" src="../svg/voltar.svg">
                        <p> Voltar</p>
                    </a>
                    <button> <img src = "../svg/notificacao.svg" alt="Símbolo de informação em laranja"/> </button>
                </header>

                
                <main class="flex flex-col w-full py-6 px-4 sm:px-8 lg:px-16 items-start gap-10 self-stretch">
                        <div class="flex flex-wrap items-center gap-16 justify-between gap-4">
                            <div class="flex flex-col gap-3">
                                <h1 class="text-3xl md:text-4xl font-semibold">Peso - Fiu</h1>
                            </div>
                            <a href="../adicionar_peso.html" class="flex items-center px-5 py-3 gap-4 rounded-2xl font-semibold border border-[#9c9c9c] hover:shadow-md transition">
                                <img class="w-5 h-5" src="../svg/adicionar.svg" alt="Botão de 'Mais'">
                                Registrar peso
                            </a>
                        </div>
    
                        <!-- GRÁFICO -->
                        <section class="rounded-3xl border border-[#E9DDCF] bg-[#F8F0E6] p-8 min-w-[50rem]">
                            <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
                                <div class="flex items-baseline gap-3">
                                    <p class="text-5xl font-bold">100g</p>
                                    <p class="font-semibold text-[#75634F]">em 28/10</p>
                                </div>
                                <div class="flex gap-2 text-sm font-semibold" role="group" aria-label="Período">
                                    <button type="button" class="rounded-full border border-[#E9DDCF] bg-[#FFFBF6] px-4 py-1.5">3 meses</button>
                                    <button type="button" aria-pressed="true" class="rounded-full border border-[#F29A4B] bg-[#F29A4B] px-4 py-1.5">6 meses</button>
                                </div>
                            </div>
    
                            <svg viewBox="0 0 600 240" class="h-auto w-full" role="img" aria-label="Gráfico de linha do peso da Fiu nos últimos 6 meses">
                                <!-- faixa ideal -->
                                <rect x="50" y="65" width="520" height="90" rx="8" fill="#EEEE88" fill-opacity="0.45"/>
                                <text x="562" y="79" text-anchor="end" font-size="10" font-weight="700" fill="#75634F">FAIXA IDEAL</text>
                                <!-- linhas de grade -->
                                <g stroke="#E9DDCF" stroke-width="1">
                                    <line x1="50" y1="20" x2="570" y2="20"/>
                                    <line x1="50" y1="65" x2="570" y2="65"/>
                                    <line x1="50" y1="110" x2="570" y2="110"/>
                                    <line x1="50" y1="155" x2="570" y2="155"/>
                                    <line x1="50" y1="200" x2="570" y2="200"/>
                                </g>
                                <!-- eixo y -->
                                <g font-size="11" font-weight="600" fill="#75634F" text-anchor="end">
                                    <text x="40" y="24">120</text>
                                    <text x="40" y="69">110</text>
                                    <text x="40" y="114">100</text>
                                    <text x="40" y="159">90</text>
                                    <text x="40" y="204">80</text>
                                </g>
                                <!-- linha -->
                                <polyline points="60,146 160,128 260,119 360,110 460,101 560,110" fill="none" stroke="#F29A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                                <!-- pontos -->
                                <g fill="#FFFBF6" stroke="#F29A4B" stroke-width="3">
                                    <circle cx="60" cy="146" r="6"/>
                                    <circle cx="160" cy="128" r="6"/>
                                    <circle cx="260" cy="119" r="6"/>
                                    <circle cx="360" cy="110" r="6"/>
                                    <circle cx="460" cy="101" r="6"/>
                                </g>
                                <circle cx="560" cy="110" r="8" fill="#F29A4B" stroke="#FFFBF6" stroke-width="3"/>
                                <!-- valores -->
                                <g font-size="12" font-weight="700" fill="#2B1A0E" text-anchor="middle">
                                    <text x="60" y="132">93</text>
                                    <text x="160" y="114">97</text>
                                    <text x="260" y="105">98</text>
                                    <text x="360" y="96">100</text>
                                    <text x="460" y="87">101</text>
                                    <text x="560" y="96">100</text>
                                </g>
                                <!-- eixo x -->
                                <g font-size="11" font-weight="700" fill="#75634F" text-anchor="middle">
                                    <text x="60" y="226">MAI</text>
                                    <text x="160" y="226">JUN</text>
                                    <text x="260" y="226">JUL</text>
                                    <text x="360" y="226">AGO</text>
                                    <text x="460" y="226">SET</text>
                                    <text x="560" y="226">OUT</text>
                                </g>
                            </svg>
                        </section>
    
                    </div>

                
                </main>
            </div>
        </div>
    </section>
    


    <!-- MOBILE -->
    <section class="block md:hidden min-h-screen w-full bg-[#FFFBF6]">

        <!-- HEADER -->
        <header class="min-h-16 px-6 py-4 border-b border-[#E9DDCF] flex items-center gap-4">
            <a href="../fiu.html" class="flex items-center gap-3">
                <img src="../svg/voltar.svg" alt="Voltar" class="w-6 h-6">
                <span class="text-lg font-semibold text-[#75634F]">Voltar</span>
            </a>
        </header>

        <!-- CONTEÚDO -->
        <main class="w-full p-5 sm:p-6 flex flex-col gap-6">

            <!-- TÍTULO -->
            <h1 class="text-2xl font-semibold text-[#120111]">
                Peso - Fiu
            </h1>

            <!-- BOTÃO REGISTRAR PESO -->
            <div class="flex justify-center w-full">
                <a href="../adicionar_peso.html"
                    class="w-full flex items-center justify-center gap-2 px-3 py-3 rounded-2xl font-semibold text-sm border border-[#9c9c9c] hover:shadow-md transition">

                    <img class="w-5 h-5" src="../svg/adicionar.svg" alt="Registrar peso">

                    <span>Registrar peso</span>
                </a>
            </div>

            <!-- GRÁFICO -->
            <section class="w-full rounded-3xl border-2 border-[#E9DDCF] bg-[#F8F0E6] p-4 sm:p-5">

                <!-- PESO ATUAL E PERÍODO -->
                <div class="mb-6 flex flex-col gap-4">

                    <div class="flex items-baseline gap-2">
                        <p class="text-4xl font-bold text-[#2B1A0E]">
                            100g
                        </p>

                        <p class="font-semibold text-sm text-[#75634F]">
                            em 28/10
                        </p>
                    </div>

                    <div class="flex justify-center gap-2 text-sm font-semibold"
                        role="group" aria-label="Período">

                        <button type="button"
                            class="rounded-full border border-[#E9DDCF] bg-[#FFFBF6] px-4 py-2">
                            3 meses
                        </button>

                        <button type="button" aria-pressed="true"
                            class="rounded-full border border-[#F29A4B] bg-[#F29A4B] px-4 py-2">
                            6 meses
                        </button>

                    </div>

                </div>

                <!-- GRÁFICO RESPONSIVO -->
                <div class="w-full overflow-hidden">

                    <svg viewBox="0 0 600 240"
                        class="w-full h-auto"
                        role="img"
                        aria-label="Gráfico de linha do peso da Fiu nos últimos 6 meses">

                        <!-- FAIXA IDEAL -->
                        <rect x="50" y="65" width="520" height="90"
                            rx="8" fill="#EEEE88" fill-opacity="0.45"/>

                        <text x="562" y="79" text-anchor="end"
                            font-size="10" font-weight="700" fill="#75634F">
                            FAIXA IDEAL
                        </text>

                        <!-- LINHAS DE GRADE -->
                        <g stroke="#E9DDCF" stroke-width="1">
                            <line x1="50" y1="20" x2="570" y2="20"/>
                            <line x1="50" y1="65" x2="570" y2="65"/>
                            <line x1="50" y1="110" x2="570" y2="110"/>
                            <line x1="50" y1="155" x2="570" y2="155"/>
                            <line x1="50" y1="200" x2="570" y2="200"/>
                        </g>

                        <!-- EIXO Y -->
                        <g font-size="11" font-weight="600"
                            fill="#75634F" text-anchor="end">
                            <text x="40" y="24">120</text>
                            <text x="40" y="69">110</text>
                            <text x="40" y="114">100</text>
                            <text x="40" y="159">90</text>
                            <text x="40" y="204">80</text>
                        </g>

                        <!-- LINHA -->
                        <polyline
                            points="60,146 160,128 260,119 360,110 460,101 560,110"
                            fill="none"
                            stroke="#F29A4B"
                            stroke-width="4"
                            stroke-linecap="round"
                            stroke-linejoin="round"/>

                        <!-- PONTOS -->
                        <g fill="#FFFBF6" stroke="#F29A4B" stroke-width="3">
                            <circle cx="60" cy="146" r="6"/>
                            <circle cx="160" cy="128" r="6"/>
                            <circle cx="260" cy="119" r="6"/>
                            <circle cx="360" cy="110" r="6"/>
                            <circle cx="460" cy="101" r="6"/>
                        </g>

                        <circle cx="560" cy="110" r="8"
                            fill="#F29A4B" stroke="#FFFBF6" stroke-width="3"/>

                        <!-- VALORES -->
                        <g font-size="12" font-weight="700"
                            fill="#2B1A0E" text-anchor="middle">
                            <text x="60" y="132">93</text>
                            <text x="160" y="114">97</text>
                            <text x="260" y="105">98</text>
                            <text x="360" y="96">100</text>
                            <text x="460" y="87">101</text>
                            <text x="560" y="96">100</text>
                        </g>

                        <!-- EIXO X -->
                        <g font-size="11" font-weight="700"
                            fill="#75634F" text-anchor="middle">
                            <text x="60" y="226">MAI</text>
                            <text x="160" y="226">JUN</text>
                            <text x="260" y="226">JUL</text>
                            <text x="360" y="226">AGO</text>
                            <text x="460" y="226">SET</text>
                            <text x="560" y="226">OUT</text>
                        </g>

                    </svg>

                </div>

            </section>

        </main>

    </section>
   
</body>
</html>
