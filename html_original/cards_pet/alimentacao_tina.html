<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alimentação</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<div class="flex min-h-dvh">

    <!-- SIDEBAR (só desktop) -->
    <aside class="hidden md:flex bg-[#F8F0E6] p-3 flex-col shrink-0 w-60 min-h-dvh" aria-label="Sidebar">
        <div class="flex flex-col flex-1 px-3 py-4 justify-between">
            <ul id="menu" class="flex-1 space-y-2 font-medium">
                <li class="flex">
                    <a href="#" class="flex flex-1 items-center px-2 py-3 rounded-2xl">
                        <span class="px-1 pb-6 text-xl font-bold">Site nome</span>
                    </a>
                    <button><img class="pb-6" src="../svg/fechar.svg" alt="X cinza para fechar menu lateral"></button>
                </li>
                <li class="pb-3 mb-2 border-b border-[#E9DDCF]">
                    <a href="#" aria-label="Perfil de Marina" class="group flex items-center gap-3 px-2 py-2 rounded-2xl hover:bg-[#E9DDCF]">
                        <span class="w-10 h-10 shrink-0 rounded-full bg-[#E9DDCF] group-hover:bg-[#F8F0E6] flex items-center justify-center font-semibold transition" aria-hidden="true">M</span>
                        <span class="flex-1 min-w-0 font-semibold truncate">Marina</span>
                    </a>
                </li>
                <!-- itens do menu gerados pelo script -->
            </ul>
        </div>
    </aside>

    <div class="flex-1 min-w-0 flex flex-col bg-[#FFFBF6]">

        <!-- HEADER (compartilhado) -->
        <header class="h-16 md:h-auto shrink-0 px-5 md:p-5 flex items-center justify-between border-b md:border border-[#E9DDCF]">
            <a href="../tina.html" class="flex items-center gap-3 md:gap-4 text-lg font-semibold md:font-normal text-[#473C31] md:text-inherit">
                <img src="../svg/voltar.svg" alt="Figura de seta laranja" class="w-5 h-5 md:w-auto md:h-auto">
                <span>Voltar</span>
            </a>
            <button class="hidden md:block"><img src="../svg/notificacao.svg" alt="Símbolo de informação em laranja"></button>
        </header>

        <main class="flex flex-col w-full py-6 px-5 sm:px-8 lg:px-16 gap-8 md:gap-10">
            <h1 class="text-3xl md:text-4xl font-semibold text-[#120111]">Alimentação</h1>

            <div class="flex flex-col md:flex-row gap-8 md:gap-9">

                <!-- ROTINA: embaixo no mobile, à esquerda no desktop -->
                <section class="order-2 md:order-1 flex-1 min-w-0">
                    <div class="flex flex-col gap-10 md:gap-16 rounded-3xl border border-[#E9DDCF] bg-[#F8F0E6] p-6 md:p-8">
                        <div class="flex justify-between items-start">
                            <h2 class="text-2xl font-semibold text-[#120111]">Rotina alimentar</h2>
                            <button id="bt-rotina-editar"><img src="../svg/edit.svg" alt="Editar" class="w-5 h-5 md:w-auto md:h-auto"></button>
                        </div>
                        <ol id="lista-rotina" class="ml-3 flex flex-col gap-12 md:gap-[5rem] border-l-2 border-[#E9DDCF] pl-8"></ol>
                    </div>
                </section>

                <!-- FAVORITOS: em cima no mobile, à direita no desktop -->
                <section class="order-1 md:order-2 w-full md:w-[32.75rem] md:shrink-0">
                    <div class="flex flex-col gap-6 rounded-3xl border border-[#E9DDCF] p-6 md:p-8">
                        <div class="flex justify-between items-start">
                            <h2 class="font-semibold text-xl text-[#120111]">Alimentos preferidos</h2>
                            <button id="bt-editar"><img src="../svg/edit.svg" alt="Editar" class="w-5 h-5 md:w-auto md:h-auto"></button>
                            <button id="bt-fechar" class="hidden"><img src="../svg/fechar.svg" alt="Fechar"></button>
                        </div>

                        <!-- modo visualização -->
                        <ol id="favoritos-ver" class="flex flex-wrap gap-3 md:gap-4 min-h-16 md:min-h-24"></ol>

                        <!-- modo edição -->
                        <ol id="favoritos-editar" class="hidden flex-wrap gap-3 md:gap-4 min-h-16 md:min-h-24"></ol>
                    </div>
                </section>

            </div>
        </main>
    </div>
</div>

<script>
    /* ---------- DADOS ---------- */
    const menu = [
        { href: "../index.html",        icone: "inicio",      alt: "Figura de uma casa na cor laranja", texto: "Início" },
        { href: "meus_pets.html",       icone: "paw-print",   alt: "Pata de animal na cor laranja",     texto: "Meus pets" },
        { href: "meus_agendamentos.html", icone: "calendario", alt: "Calendario na cor laranja",        texto: "Agendamentos", ativo: true },
        { href: "meus_alertas.html",    icone: "notificacao", alt: "Sino de alerta na cor laranja",     texto: "Alertas" },
        { href: "tutores.html",         icone: "tutores",     alt: "Figura de usuários na cor laranja", texto: "Outros tutores" },
    ];

    const rotina = [
        { periodo: "Manhã", horario: "Entre 6h e 9h",   refeicao: "Ração em porção pequena" },
        { periodo: "Tarde", horario: "Entre 12h e 15h", refeicao: "Petisco de carne ou maçã em cubos" },
        { periodo: "Noite", horario: "Entre 20h e 22h", refeicao: "Ração com opções: brócolis, cenoura" },
    ];

    let favoritos = ["Frango cozido", "Brócolis", "Banana", "Petisco de carne"];

    /* ---------- RENDER ---------- */
    document.getElementById("menu").insertAdjacentHTML("beforeend", menu.map((m) => `
        <li class="${m.ativo ? "relative" : ""}">
            ${m.ativo ? '<span class="absolute left-0 top-1/2 -translate-y-1/2 h-10 w-1.5 rounded-r bg-[#F29A4B]"></span>' : ""}
            <a href="${m.href}" class="flex items-center px-2 py-3 ${m.ativo ? "pl-6" : ""} rounded-2xl hover:bg-[#E9DDCF] group">
                <img src="../svg/${m.icone}.svg" alt="${m.alt}">
                <span class="flex-1 ms-3 whitespace-nowrap">${m.texto}</span>
            </a>
        </li>`).join(""));

    document.getElementById("lista-rotina").innerHTML = rotina.map((r) => `
        <li class="relative flex flex-col gap-2">
            <span class="absolute -left-[41px] top-1 h-4 w-4 rounded-full border-4 border-[#F8F0E6] bg-[#F29A4B]"></span>
            <p class="w-fit md:w-full max-w-full md:max-w-[15rem] text-md font-semibold bg-[#E9DDCF] rounded-full px-4 py-2 text-[#473C31]">${r.periodo} - ${r.horario}</p>
            <p class="editavel text-lg md:text-xl font-semibold text-[#120111]">${r.refeicao}</p>
        </li>`).join("");

    const listaVer = document.getElementById("favoritos-ver");
    const listaEditar = document.getElementById("favoritos-editar");

    function renderFavoritos() {
        listaVer.innerHTML = favoritos.map((f) => `
            <li class="px-4 py-2 text-md font-semibold rounded-full border border-[#F29A4B] text-[#120111]"><p>${f}</p></li>`).join("");

        listaEditar.innerHTML = favoritos.map((f, i) => `
            <li>
                <span class="inline-flex items-center bg-[#FEF3E8] border border-[#F29A4B] text-[#120111] text-md font-semibold ps-4 pe-2 py-2 rounded-full gap-2">
                    <span>${f}</span>
                    <button type="button" data-remover="${i}" aria-label="Remover ${f}" class="inline-flex items-center p-0.5 rounded-full hover:bg-[#F29A4B]/20">
                        <svg class="w-4 h-4" aria-hidden="true" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/></svg>
                    </button>
                </span>
            </li>`).join("") + `
            <li>
                <button id="bt-adicionar" type="button" class="inline-flex items-center p-0.5 rounded-full hover:bg-[#F29A4B]/20" aria-label="Adicionar alimento favorito">
                    <img src="../svg/adicionar2.svg" alt="Adicionar alimento">
                </button>
            </li>`;
    }
    renderFavoritos();

    /* ---------- FAVORITOS: alternar ver/editar ---------- */
    const btEditar = document.getElementById("bt-editar");
    const btFechar = document.getElementById("bt-fechar");

    function modoEdicao(ativo) {
        listaVer.classList.toggle("hidden", ativo);
        listaEditar.classList.toggle("hidden", !ativo);
        listaEditar.classList.toggle("flex", ativo);
        btEditar.classList.toggle("hidden", ativo);
        btFechar.classList.toggle("hidden", !ativo);
    }
    btEditar.addEventListener("click", () => modoEdicao(true));
    btFechar.addEventListener("click", () => modoEdicao(false));

    // um único listener para remover e adicionar (delegação de eventos)
    listaEditar.addEventListener("click", (e) => {
        const remover = e.target.closest("[data-remover]");
        if (remover) {
            favoritos.splice(Number(remover.dataset.remover), 1);
            renderFavoritos();
            return;
        }
        if (e.target.closest("#bt-adicionar")) {
            const novo = prompt("Novo alimento favorito:");
            if (novo && novo.trim()) {
                favoritos.push(novo.trim());
                renderFavoritos();
            }
        }
    });

    /* ---------- ROTINA: editar texto ---------- */
    let editandoRotina = false;
    document.getElementById("bt-rotina-editar").addEventListener("click", () => {
        editandoRotina = !editandoRotina;
        const textos = document.querySelectorAll("#lista-rotina .editavel");
        textos.forEach((p) => {
            p.contentEditable = editandoRotina;
            p.classList.toggle("outline", editandoRotina);
            p.classList.toggle("outline-2", editandoRotina);
            p.classList.toggle("outline-[#F29A4B]", editandoRotina);
        });
        if (editandoRotina) textos[0].focus();
    });
</script>

</body>
</html>
